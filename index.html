  <style>
    @property --border-angle {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    :root {
      --bg-main: #08090d;
      --surface-1: rgba(12, 14, 20, 0.72);
      --surface-2: rgba(28, 32, 45, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(176, 38, 255, 0.5);
      --neon-purple: #b026ff;
      --purple-glow: rgba(176, 38, 255, 0.6);
      --neon-green: #00ff66;
      --green-glow: rgba(0, 255, 102, 0.5);
      --metal-gray: #d0d5e2;
      --telegram-blue: #229ed9;
      --telegram-glow: rgba(34, 158, 217, 0.6);
      --tiktok-glow: rgba(255, 255, 255, 0.7);
      --text-primary: #ffffff;
      --text-secondary: #c5cad8;
      --text-muted: #8b92a5;
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100%;
      height: var(--app-height);
      max-height: var(--app-height);
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    body {
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(176, 38, 255, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 85% 100%, rgba(0, 255, 102, 0.15) 0%, transparent 45%);
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      height: clamp(46px, 5.8vh, 54px);
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(8, 9, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 50;
    }

    @media (min-width: 900px) {
      .header-bar {
        padding: 0 24px;
        height: 54px;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-cassette-svg {
      width: clamp(28px, 3.8vh, 36px);
      height: clamp(28px, 3.8vh, 36px);
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(176, 38, 255, 0.5)) drop-shadow(0 0 10px rgba(0, 255, 102, 0.4));
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .brand-cassette-svg:hover {
      transform: scale(1.08) rotate(-2deg);
    }

    .brand-text-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.05;
      gap: 0px;
      min-width: 0;
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: clamp(16px, 2.25vh, 20px);
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-24deg);
      animation: cyberSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    .brand-slogan {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(10.5px, 1.35vh, 12.5px);
      font-weight: 700;
      color: var(--neon-green);
      letter-spacing: 0.4px;
      text-transform: none;
      opacity: 0.95;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-nexus {
      color: var(--neon-purple);
      text-shadow: 0 0 10px var(--purple-glow), 0 0 22px rgba(176, 38, 255, 0.4);
      animation: pulseNeonPurple 3.2s ease-in-out infinite alternate;
    }

    .title-zone {
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--green-glow), 0 0 22px rgba(0, 255, 102, 0.4);
      animation: pulseNeonGreen 3.2s ease-in-out infinite alternate;
    }

    @keyframes pulseNeonPurple {
      0% { text-shadow: 0 0 8px var(--purple-glow); }
      100% { text-shadow: 0 0 14px var(--neon-purple), 0 0 24px rgba(176, 38, 255, 0.5); }
    }

    @keyframes pulseNeonGreen {
      0% { text-shadow: 0 0 8px var(--green-glow); }
      100% { text-shadow: 0 0 14px var(--neon-green), 0 0 24px rgba(0, 255, 102, 0.5); }
    }

    @keyframes cyberSweep {
      0%, 65% { left: -120%; opacity: 0; }
      70% { opacity: 0.8; }
      80% { left: 160%; opacity: 0; }
      100% { left: 160%; opacity: 0; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(30px, 3.8vh, 36px);
      height: clamp(30px, 3.8vh, 36px);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .social-btn svg {
      width: clamp(15px, 2vh, 18px);
      height: clamp(15px, 2vh, 18px);
      fill: currentColor;
    }

    @media (hover: hover) {
      .social-tiktok:hover {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        box-shadow: 0 0 16px var(--tiktok-glow), 0 0 6px #ffffff;
        transform: translateY(-2px);
      }
      .social-telegram:hover {
        border-color: var(--telegram-blue);
        background: rgba(34, 158, 217, 0.2);
        color: var(--telegram-blue);
        box-shadow: 0 0 16px var(--telegram-glow), 0 0 6px var(--telegram-blue);
        transform: translateY(-2px);
      }
    }

    .workspace {
      flex: 1;
      width: 100%;
      height: calc(100% - clamp(46px, 5.8vh, 54px));
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 28vw) 1fr;
        gap: clamp(10px, 1.3vw, 18px);
        padding: clamp(6px, 1vh, 12px) clamp(10px, 1.4vw, 20px);
        max-width: 1920px;
        margin: 0 auto;
        box-sizing: border-box;
      }
    }

    @media (min-width: 1440px) {
      .workspace {
        grid-template-columns: 430px 1fr;
        gap: 20px;
        padding: 12px 24px 14px 24px;
      }
    }

    .player-deck {
      background: var(--surface-1);
      border-radius: 0;
      padding: clamp(6px, 1vh, 12px) clamp(10px, 2vw, 16px);
      padding-bottom: calc(clamp(6px, 1vh, 10px) + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
    }

    @media (min-width: 900px) {
      .player-deck {
        border: 1px solid var(--border-subtle);
        border-radius: clamp(14px, 2vh, 22px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      }
    }

    .player-bg-art {
      position: absolute;
      inset: -15px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(16px) brightness(0.7);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
      transform: scale(1.05) translateZ(0);
      will-change: opacity;
      transition: opacity 0.5s ease;
    }

    /* 1. CARÁTULA */
    .cover-wrapper {
      width: min(90vw, calc(100dvh - 310px));
      max-width: 90vw;
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: clamp(14px, 2.2vh, 22px);
      margin-top: clamp(8px, 1.8vh, 18px);
      margin-bottom: clamp(8px, 1.8vh, 18px);
      position: relative;
      background: #0d0e15;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      will-change: transform;
      z-index: 2;
      min-height: 0;
    }

    @media (min-width: 900px) {
      .cover-wrapper {
        width: min(95%, calc(100dvh - 360px));
        max-width: 95%;
        margin-top: clamp(22px, 3.8vh, 42px);
        margin-bottom: clamp(22px, 3.8vh, 42px);
      }
    }

    .cover-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      padding: 2.5px;
      background: conic-gradient(
        from var(--border-angle),
        transparent 0%,
        var(--neon-purple) 20%,
        transparent 38%,
        transparent 50%,
        var(--neon-green) 70%,
        transparent 88%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
      transition: opacity 0.4s ease;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: calc(clamp(14px, 2.2vh, 22px) - 3px);
      object-fit: cover;
      object-position: center;
      background: #08090d;
      position: relative;
      z-index: 2;
      display: block;
    }

    .is-playing .cover-wrapper {
      border-color: transparent;
      box-shadow: 
        0 14px 34px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(176, 38, 255, 0.4), 
        0 0 14px rgba(0, 255, 102, 0.25);
      transform: translateY(-2px);
    }

    .is-playing .cover-wrapper::before {
      opacity: 1;
      animation: neonBorderRotate 4.5s linear infinite;
    }

    @keyframes neonBorderRotate {
      to {
        --border-angle: 360deg;
      }
    }

    /* 2. ZONA INTERMEDIA */
    .deck-mid-section {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      position: relative;
      z-index: 2;
    }

    .deck-info-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2px, 0.4vh, 4px);
      flex-shrink: 0;
    }

    .title-marquee-container {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      position: relative;
      text-align: center;
      margin-bottom: 2px;
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
    }

    /* TÍTULO DE CANCIÓN */
    #display_title {
      font-size: clamp(17px, 2.3vh, 23px);
      font-weight: 900;
      letter-spacing: 0.3px;
      line-height: 1.2;
      white-space: nowrap;
      display: inline-block;
      padding: 0 10px;
      color: var(--text-primary);
      text-align: center;
      will-change: transform;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    .marquee-active {
      animation: pingPongBounce var(--marquee-duration, 10s) ease-in-out infinite alternate !important;
    }

    @keyframes pingPongBounce {
      0%, 15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--scroll-distance, -50px)); }
    }

    .meta-artist {
      font-size: clamp(11.5px, 1.4vh, 14px);
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
      margin-bottom: clamp(1px, 0.4vh, 3px);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .meta-dj-row {
      margin-bottom: clamp(1px, 0.4vh, 3px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .emit-label {
      color: var(--neon-purple);
      font-size: clamp(13px, 1.7vh, 18px);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--purple-glow);
    }

    #display_dj {
      display: inline-block;
      color: var(--neon-green);
      font-size: clamp(13px, 1.7vh, 18px);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--green-glow);
    }

    /* PAÍS Y BANDERA */
    .dj-country-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(13px, 1.7vh, 18px);
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #e2e6f0;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
      min-height: 20px;
      margin-top: 1px;
    }

    .dj-flag-img {
      width: clamp(20px, 2.5vh, 28px);
      height: clamp(14px, 1.8vh, 19px);
      border-radius: 3px;
      object-fit: cover;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      display: inline-block;
      flex-shrink: 0;
    }

    /* CONTENEDOR BOTONES */
    .deck-buttons-container {
      width: 100%;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 2px 0;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 16px);
      width: 100%;
      flex-wrap: nowrap;
    }

    .btn-play-hero {
      background: #b026ff !important;
      border: none;
      color: white;
      width: clamp(58px, 7.4vh, 76px);
      height: clamp(58px, 7.4vh, 76px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(176, 38, 255, 0.75) !important;
      transition: transform 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .btn-play-hero svg {
      width: clamp(26px, 3.4vh, 36px);
      height: clamp(26px, 3.4vh, 36px);
    }

    .btn-play-hero:active {
      transform: scale(0.94);
    }

    .btn-deck-action {
      background: rgba(0, 255, 102, 0.14);
      border: 1px solid rgba(0, 255, 102, 0.45);
      color: var(--neon-green);
      padding: 0 14px;
      height: clamp(34px, 4.2vh, 40px);
      border-radius: 22px;
      font-family: inherit;
      font-size: clamp(10.5px, 1.3vh, 12px);
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      outline: none;
    }

    /* ESTILO ILUMINADO ACTIVO PARA EL BOTÓN DE CHAT (FORZADO) */
    .btn-deck-action.chat-active-glow,
    #btnDeckChat.chat-active-glow {
      background: rgba(0, 255, 102, 0.45) !important;
      border-color: #00ff66 !important;
      color: #ffffff !important;
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.95), 0 0 10px #00ff66 !important;
    }

    .btn-deck-staff {
      display: flex;
    }

    @media (min-width: 900px) {
      .btn-deck-staff {
        display: none !important;
      }
    }

    /* 3. PARTE INFERIOR */
    .deck-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.8vh, 8px);
      margin-bottom: clamp(3px, 0.6vh, 6px);
      flex-shrink: 0;
      z-index: 2;
    }

    .equalizer-canvas-container {
      width: 100%;
      height: clamp(24px, 3.4vh, 38px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      contain: strict;
    }

    #equalizerCanvas {
      width: 100%;
      height: 100%;
      display: block;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 34px;
      width: 100%;
      flex-shrink: 0;
    }

    .vol-icon {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: fill 0.2s;
    }

    .vol-icon:hover {
      fill: var(--text-primary);
    }

    .volume-slider {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, #b026ff 100%, rgba(255, 255, 255, 0.1) 100%);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px #b026ff;
    }

    .library-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      height: var(--app-height);
      background: rgba(10, 12, 17, 0.98);
      z-index: 100;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(12px + env(safe-area-inset-bottom, 0px)) 14px;
      display: flex;
      flex-direction: column;
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.2, 1);
      visibility: hidden;
    }

    .library-panel.drawer-open {
      transform: translateY(0%);
      visibility: visible;
    }

    @media (min-width: 900px) {
      .library-panel {
        position: static;
        width: 100%;
        height: 100%;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: clamp(14px, 2vh, 22px);
        padding: clamp(6px, 1vh, 12px) clamp(8px, 1vw, 14px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        transform: none !important;
        visibility: visible !important;
        z-index: 1;
        overflow: hidden;
      }
    }

    .drawer-mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    @media (min-width: 900px) {
      .drawer-mobile-header {
        display: none;
      }
    }

    .drawer-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--neon-green);
    }

    .btn-close-drawer {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    .panel-header {
      display: flex;
      margin-bottom: clamp(3px, 0.6vh, 6px);
      flex-shrink: 0;
    }

    /* OCULTAR LA BARRA DE PESTAÑAS EN MÓVIL SI ESTÁ ACTIVO EL CHAT */
    @media (max-width: 899px) {
      .library-panel.chat-mode-active .panel-header {
        display: none !important;
      }
    }

    .tabs-group {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 2px;
      gap: 4px;
      width: 100%;
      max-width: 320px;
    }

    .tab-item {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: clamp(3px, 0.6vh, 6px) 8px;
      font-family: inherit;
      font-weight: 700;
      font-size: clamp(10px, 1.25vh, 12px);
      letter-spacing: 0.3px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    #tabChat { display: none; }

    .tab-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .tab-view-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: #08090d;
    }

    .view-content {
      width: 100%;
      height: 100%;
      display: none;
    }

    .view-content.active {
      display: block;
    }

    .chat-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #08090d;
      filter: invert(0.92) hue-rotate(180deg) contrast(1.12) brightness(0.92);
    }

    .staff-container {
      width: 100%;
      height: 100%;
      background: var(--surface-1);
      padding: 10px 12px;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      list-style: none;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 4px 0 18px 0;
    }

    @media (min-width: 900px) {
      .staff-container {
        overflow: hidden;
        padding: clamp(4px, 0.6vh, 6px);
        justify-content: center;
      }
      .staff-grid {
        grid-template-columns: repeat(5, 1fr) !important;
        grid-template-rows: repeat(3, 1fr) !important;
        height: 100%;
        max-width: none;
        gap: clamp(4px, 0.6vw, 8px);
        align-content: stretch;
        padding: 0;
      }
    }

    .staff-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: clamp(10px, 1.4vh, 16px);
      padding: 12px 10px 14px 10px;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 230px;
    }

    @media (min-width: 900px) {
      .staff-card {
        min-height: 0;
        height: 100%;
        padding: 3px 2px;
        border-radius: clamp(8px, 1.2vh, 14px);
      }
    }

    .staff-card:hover {
      transform: translateY(-2px);
      border-color: var(--neon-purple);
      background: rgba(176, 38, 255, 0.08);
      box-shadow: 0 6px 18px rgba(176, 38, 255, 0.35);
    }

    .staff-avatar-img {
      width: min(150px, 48vw);
      height: min(150px, 48vw);
      aspect-ratio: 1 / 1;
      border-radius: clamp(8px, 1.2vh, 14px);
      object-fit: cover;
      border: 2px solid var(--neon-purple);
      background: #08090d;
      box-shadow: 0 0 12px rgba(176, 38, 255, 0.35);
      margin: 0 auto;
      transition: transform 0.2s ease;
    }

    @media (min-width: 900px) {
      .staff-avatar-img {
        flex: 1;
        min-height: 0;
        max-height: 68%;
        width: auto;
        max-width: 92%;
        margin: 0;
      }
    }

    .staff-card:hover .staff-avatar-img {
      transform: scale(1.04);
    }

    .staff-info {
      width: 100%;
      text-align: center;
      padding: 0 2px;
      flex-shrink: 0;
      margin: 4px 0 2px 0;
    }

    @media (min-width: 900px) {
      .staff-info {
        margin: 1px 0;
      }
    }

    .staff-name {
      font-size: clamp(15px, 2vh, 19px);
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.15;
    }

    .staff-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 8px;
      flex-shrink: 0;
      box-sizing: border-box;
      margin-top: 4px;
    }

    @media (min-width: 900px) {
      .staff-bottom-row {
        padding: 0 4px;
        margin-top: 0;
      }
    }

    /* BADGE DE PAÍS EN STAFF */
    .staff-country-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: clamp(10px, 1.25vh, 12px);
      font-weight: 700;
      color: #e2e6f0;
      background: rgba(8, 9, 13, 0.9);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 48%;
    }

    .staff-country-badge img {
      width: clamp(14px, 1.6vh, 18px);
      height: clamp(9px, 1.1vh, 12px);
      border-radius: 2px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .staff-badge {
      background: rgba(0, 255, 102, 0.18);
      border: 1px solid rgba(0, 255, 102, 0.65);
      color: var(--neon-green);
      font-size: clamp(10px, 1.25vh, 12px);
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
      text-transform: none;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 48%;
    }

    /* VISTA MAXIMIZADA PARA EL POEMA */
    .poema-container {
      width: 100%;
      height: 100%;
      background: var(--surface-1);
      padding: clamp(6px, 1vh, 12px);
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .poema-card-wrapper {
      width: 100%;
      height: 100%;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: clamp(12px, 1.8vh, 18px);
      padding: clamp(6px, 1vh, 10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      box-sizing: border-box;
    }

    .poema-img-frame {
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--neon-purple);
      box-shadow: 0 0 18px rgba(176, 38, 255, 0.35);
      background: #08090d;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .poema-img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      border-radius: inherit;
    }

    .poema-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 2px 6px;
      font-size: clamp(11px, 1.3vh, 13px);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* TÍTULO A LA IZQUIERDA: VERDE NEÓN */
    .poema-title-tag {
      color: var(--neon-green);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    /* DEDICATORIA/AUTOR A LA DERECHA (NEXUS ZONE): MORADO NEÓN */
    .poema-date-tag {
      color: var(--neon-purple);
      text-shadow: 0 0 10px var(--purple-glow), 0 0 18px rgba(176, 38, 255, 0.4);
      letter-spacing: 0.3px;
    }

    .dj-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .dj-modal-overlay.modal-active {
      opacity: 1;
      pointer-events: auto;
    }

    .dj-modal-card {
      width: 100%;
      max-width: 400px;
      background: #0f1118;
      border: 1px solid var(--neon-purple);
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(176, 38, 255, 0.45), 0 0 25px rgba(0, 255, 102, 0.25);
      padding: 16px 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: scale(0.92) translateY(15px);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dj-modal-overlay.modal-active .dj-modal-card {
      transform: scale(1) translateY(0);
    }

    .btn-close-modal {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-close-modal:hover {
      background: var(--neon-purple);
      border-color: var(--neon-purple);
    }

    .modal-dj-avatar {
      height: clamp(80px, 15vh, 130px);
      width: clamp(80px, 15vh, 130px);
      aspect-ratio: 1 / 1;
      border-radius: clamp(6px, 1vh, 12px);
      object-fit: cover;
      border: 2px solid var(--neon-purple);
      box-shadow: 0 8px 24px var(--purple-glow);
      margin: 0 auto;
      background: #08090d;
      flex-shrink: 0;
    }

    .modal-dj-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      font-size: clamp(15px, 2vh, 19px);
      margin: clamp(4px, 0.8vh, 8px) 0 clamp(2px, 0.4vh, 4px) 0;
      text-transform: none;
      line-height: 1.2;
    }

    .modal-dj-role-pill {
      display: inline-block;
      background: rgba(0, 255, 102, 0.18);
      border: 1px solid rgba(0, 255, 102, 0.65);
      color: var(--neon-green);
      font-size: clamp(9px, 1.2vh, 11px);
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
      text-transform: none;
      margin-top: 2px;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }

    /* PAÍS EN MODAL */
    .modal-dj-country {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(9px, 1.2vh, 11px);
      font-weight: 700;
      color: #e2e6f0;
      margin-top: 3px;
      text-transform: none;
    }

    .modal-dj-country img {
      width: clamp(12px, 1.5vh, 15px);
      height: clamp(8px, 1vh, 10px);
      border-radius: 2px;
      object-fit: cover;
    }

    .modal-divider {
      width: 100%;
      height: 1px;
      background: var(--border-subtle);
      margin: 8px 0;
    }

    .modal-info-block {
      width: 100%;
      text-align: left;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .modal-info-title {
      font-size: clamp(9px, 1.2vh, 11px);
      font-weight: 800;
      color: var(--neon-green);
      letter-spacing: 0.3px;
      text-transform: none;
      margin-bottom: 2px;
    }

    .modal-info-text {
      font-size: 11.5px;
      color: #e2e6f0;
      line-height: 1.35;
      text-transform: none;
    }
  </style>
</head>

  <main class="workspace" id="mainWorkspace">
    <section class="player-deck" id="playerDeck">
      <div class="player-bg-art" id="playerBgArt"></div>

      <!-- 1. CARÁTULA -->
      <div class="cover-wrapper">
        <img src="djs/nexusdj.webp" id="coverImg" class="cover-img" alt="Foto del DJ">
      </div>
      
      <!-- 2. ZONA INTERMEDIA -->
      <div class="deck-mid-section">
        <div class="deck-info-container">
          <div class="title-marquee-container" id="marqueeContainer">
            <div id='sonic_title' style="display: none;"></div>
            <div id='display_title'>Cargando emisión...</div>
          </div>

          <div class="meta-artist" id="trackArtist">Nexus Zone Radio</div>

          <div class="meta-dj-row">
            <span class="emit-label">Emitiendo:</span>
            <div id='sonic_dj' style="display: none;"></div>
            <span id='display_dj'>NeXusDj</span>
          </div>

          <div class="dj-country-row" id="djCountryRow">

        </div>

        <div class="deck-buttons-container">

                <path d="M8 5v14l11-7z"/>

            <!-- BOTÓN DE CHAT -->
            <button class="btn-deck-action" id="btnDeckChat" title="Abrir Chat" aria-label="Abrir Chat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
              </svg>
              <span>Chat</span>
            </button>

            <button class="btn-deck-action btn-deck-staff" id="btnDeckStaff" title="Ver Staff y Poema" aria-label="Ver Staff y Poema">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>

      <!-- 3. PARTE INFERIOR -->

        </div>

        <div class="volume-row">
          <svg class="vol-icon" id="volMuteBtn" viewBox="0 0 24 24">

          </svg>

  <script>
    if ('serviceWorker' in navigator) {

    }

    const STREAM_URL = "https://mars.streamerr.co/8434/stream";

    const audio = document.getElementById("audioSource");
    const playerDeck = document.getElementById("playerDeck");
    const playerBgArt = document.getElementById("playerBgArt");
    const libraryPanel = document.getElementById("libraryPanel");
    const btnPlay = document.getElementById("btnPlay");
    const playIcon = document.getElementById("playIcon");
    const btnDeckChat = document.getElementById("btnDeckChat");
    const btnDeckStaff = document.getElementById("btnDeckStaff");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");
    const chatIframe = document.getElementById("chatIframe");

    const tabChat = document.getElementById("tabChat");

    const staffListGrid = document.getElementById("staffListGrid");

    const btnCloseModal = document.getElementById("btn-close-modal");
    const modalDjImg = document.getElementById("modalDjImg");

    let isPlaying = false;

    let lastObservedTitle = "";

    document.addEventListener("DOMContentLoaded", () => {
      // 1. NICK AUTOMÁTICO NeXus_User (1 al 100) Y CONFIGURAR EL CHAT
      const randomNum = Math.floor(Math.random() * 100) + 1;

      // 2. CARGA DEL STAFF
      function loadStaffMembers() {
        try {
          if (window.STAFF_MEMBERS && Array.isArray(window.STAFF_MEMBERS)) {
            renderStaffGrid(window.STAFF_MEMBERS);
          }
        } catch (_) {}
      }

      function renderStaffGrid(members) {
        staffListGrid.innerHTML = "";
        members.forEach((dj) => {
          const li = document.createElement("li");
          li.className = "staff-card";

          const flagUrl = dj.flag ? `https://flagcdn.com/24x18/${dj.flag.toLowerCase()}.png` : "";
          const imgSrc = dj.image ? `${dj.image}` : `djs/nexusdj.webp`;

          // Precarga invisible para evitar fallos de renderizado en PC
          const preloadImg = new Image();
          preloadImg.src = imgSrc;

          li.innerHTML = `
            <img src="${imgSrc}" class="staff-avatar-img" alt="${dj.name}" loading="eager" decoding="sync" onerror="this.onerror=null; this.src='djs/nexusdj.webp';">
            <div class="staff-info">
              <div class="staff-name">${dj.name}</div>
            </div>
            <div class="staff-bottom-row">
              <div class="staff-country-badge">
                <span>${dj.country || "Int."}</span>
                ${flagUrl ? `<img src="${flagUrl}" alt="${dj.country}" loading="eager" decoding="async">` : ""}

              <span class="staff-badge">${dj.badge || "Staff"}</span>
            </div>
          `;

          li.addEventListener("click", () => openDjModal(dj, li));
          staffListGrid.appendChild(li);
        });
      }

      function openDjModal(dj, cardElement) {
        const imgSrc = dj.image ? `${dj.image}` : "djs/nexusdj.webp";
        modalDjImg.src = imgSrc;
        modalDjImg.onerror = () => { 
          modalDjImg.onerror = null; 
          modalDjImg.src = "djs/nexusdj.webp"; 
        };

        if (cardElement) {
          const cardImg = cardElement.querySelector(".staff-avatar-img");
          if (cardImg) {
            const rect = cardImg.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              modalDjImg.style.width = `${Math.round(rect.width)}px`;
              modalDjImg.style.height = `${Math.round(rect.height)}px`;
            }
          }
        }
        
        modalDjName.textContent = dj.name;
        modalDjRole.textContent = dj.role || dj.badge || "Miembro del Staff";
        
        if (dj.country) {
          modalDjCountryName.textContent = dj.country;
          if (dj.flag) {
            modalDjFlag.src = `https://flagcdn.com/24x18/${dj.flag.toLowerCase()}.png`;
            modalDjFlag.style.display = "inline-block";
          } else {
            modalDjFlag.style.display = "none";
          }
          document.getElementById("modalDjCountry").style.display = "flex";
        } else {
          document.getElementById("modalDjCountry").style.display = "none";
        }

        modalDjDesc.textContent = dj.description || "No hay información adicional disponible.";
        modalDjSchedule.textContent = dj.schedule || "Sin horarios fijos especificados.";

        djModalOverlay.classList.add("modal-active");
      }

      function closeDjModal() {
        djModalOverlay.classList.remove("modal-active");
      }

      btnCloseModal.addEventListener("click", closeDjModal);
      djModalOverlay.addEventListener("click", (e) => {
        if (e.target === djModalOverlay) closeDjModal();
      });

      loadStaffMembers();

      // 3. CARGA DEL POEMA DE LA SEMANA
      function loadPoemaSemana() {
        if (window.POEMA_SEMANA) {
          if (window.POEMA_SEMANA.image) {
            poemaImgEl.src = window.POEMA_SEMANA.image;
          }
          if (window.POEMA_SEMANA.author) {
            poemaTitleEl.textContent = window.POEMA_SEMANA.author;
          }
          if (window.POEMA_SEMANA.date) {
            poemaDateEl.textContent = window.POEMA_SEMANA.date;
          }
        }
      }
      loadPoemaSemana();

      // 4. PESTAÑAS Y NAVEGACIÓN (CONTROL DE ILUMINACIÓN DE CHAT)
      function activateTab(tabName) {
        tabChat.classList.remove("active");
        tabStaff.classList.remove("active");
        tabPoema.classList.remove("active");

        viewChat.classList.remove("active");
        viewStaff.classList.remove("active");
        viewPoema.classList.remove("active");

        if (tabName === "chat") {
          libraryPanel.classList.add("chat-mode-active");
          tabChat.style.display = "flex";
          tabChat.classList.add("active");
          viewChat.classList.add("active");
          btnDeckChat.classList.add("chat-active-glow");
        } else if (tabName === "poema") {
          libraryPanel.classList.remove("chat-mode-active");
          tabChat.style.display = "none";
          tabPoema.classList.add("active");
          viewPoema.classList.add("active");
          btnDeckChat.classList.remove("chat-active-glow");
          btnDeckChat.blur();
        } else {
          libraryPanel.classList.remove("chat-mode-active");
          tabChat.style.display = "none";
          tabStaff.classList.add("active");
          viewStaff.classList.add("active");
          btnDeckChat.classList.remove("chat-active-glow");
          btnDeckChat.blur();
        }
      }

      btnDeckChat.addEventListener("click", () => {
        const isMobile = window.innerWidth < 900;
        const isDrawerOpen = libraryPanel.classList.contains("drawer-open");
        const isChatVisible = viewChat.classList.contains("active");

        if (isMobile) {
          if (isDrawerOpen && isChatVisible) {
            libraryPanel.classList.remove("drawer-open");
            libraryPanel.classList.remove("chat-mode-active");
            btnDeckChat.classList.remove("chat-active-glow");
            btnDeckChat.blur();
          } else {
            activateTab("chat");
            libraryPanel.classList.add("drawer-open");
          }
        } else {
          if (isDrawerOpen && isChatVisible) {
            activateTab("staff");
            libraryPanel.classList.remove("drawer-open");
            btnDeckChat.classList.remove("chat-active-glow");
          } else {
            activateTab("chat");
            libraryPanel.classList.add("drawer-open");
            btnDeckChat.classList.add("chat-active-glow");
          }
        }
      });

      btnDeckStaff.addEventListener("click", () => {
        btnDeckChat.classList.remove("chat-active-glow");
        btnDeckChat.blur();
        libraryPanel.classList.remove("chat-mode-active");
        if (libraryPanel.classList.contains("drawer-open") && (viewStaff.classList.contains("active") || viewPoema.classList.contains("active"))) {
          libraryPanel.classList.remove("drawer-open");
        } else {
          activateTab("staff");
          libraryPanel.classList.add("drawer-open");
        }
      });

      btnCloseDrawer.addEventListener("click", () => {
        libraryPanel.classList.remove("drawer-open");
        libraryPanel.classList.remove("chat-mode-active");
        btnDeckChat.classList.remove("chat-active-glow");
        btnDeckChat.blur();
        activateTab("staff");
      });

      tabChat.addEventListener("click", () => activateTab("chat"));
      tabStaff.addEventListener("click", () => {
        activateTab("staff");
        btnDeckChat.classList.remove("chat-active-glow");
      });
      tabPoema.addEventListener("click", () => {
        activateTab("poema");
        btnDeckChat.classList.remove("chat-active-glow");
      });

      // 5. SOPORTE DE DESLIZAMIENTO TÁCTIL (SWIPE GESTURES)
      let touchStartX = 0;
      let touchStartY = 0;

      libraryPanel.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      libraryPanel.addEventListener("touchend", (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (!viewChat.classList.contains("active")) {
          if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
            if (diffX > 0) {
              if (viewStaff.classList.contains("active")) {
                activateTab("poema");
              }
            } else {
              if (viewPoema.classList.contains("active")) {
                activateTab("staff");
              }
            }
          }
        }
      }, { passive: true });

      // 6. MAPA DE DJS Y METADATOS
      async function loadDjMap() {
        try {
          const res = await fetch("djs.json?nocache=" + Date.now());
          if (res.ok) {
            djMap = await res.json();
            if (djMap.social) {
              if (djMap.social.tiktok) linkTiktok.href = djMap.social.tiktok;
              if (djMap.social.telegram) linkTelegram.href = djMap.social.telegram;
            }
          }
        } catch (_) {
          djMap = {
            "no dj": { display: "NeXusDj", image: "djs/nexusdj.webp", country: "España", flag: "es" },
            "yahirmaniaca": { display: "YaHiRMaNiaCa", image: "djs/yahirmaniaca.webp", country: "México", flag: "mx" },
            "|lu5|0n": { display: "|lu5|0n", image: "djs/lu50n.webp", country: "Argentina", flag: "ar" },
            "castle": { display: "Castle", image: "djs/castle.webp", country: "España", flag: "es" }
          };
        }
        processDjUpdate(sonicDj.textContent.trim());
      }
      loadDjMap();

      function processDjUpdate(rawDj) {
        if (!rawDj) rawDj = "no dj";
        let cleanDj = rawDj.replace(/\s+/g, ' ').trim();
        let lookupKey = cleanDj.toLowerCase();

        if (lookupKey === "" || lookupKey === "nodj" || lookupKey.includes("no dj")) {
          lookupKey = "no dj";
        }

        lastObservedDjRaw = lookupKey;

        let styledName = cleanDj;
        let imgPath = `djs/${encodeURIComponent(lookupKey)}.webp`;
        let country = "España";
        let flagCode = "es";

        if (djMap[lookupKey]) {
          styledName = djMap[lookupKey].display || styledName;
          imgPath = djMap[lookupKey].image || imgPath;
          country = djMap[lookupKey].country || "";
          flagCode = djMap[lookupKey].flag || "";
        } else if (lookupKey === "no dj") {
          styledName = "NeXusDj";
          imgPath = "djs/nexusdj.webp";
          country = "España";
          flagCode = "es";
        }

        displayDj.textContent = styledName;

        if (country) {
          djCountryName.textContent = country;
          if (flagCode) {
            djFlagImg.src = `https://flagcdn.com/24x18/${flagCode.toLowerCase()}.png`;
            djFlagImg.style.display = "inline-block";
          } else {
            djFlagImg.style.display = "none";
          }
          djCountryRow.style.display = "flex";
        } else {
          djCountryRow.style.display = "none";
        }

        coverImg.onerror = () => {
          coverImg.onerror = null;
          coverImg.src = DEFAULT_COVER;
        };
        coverImg.src = imgPath;
      }

      const djObserver = new MutationObserver(() => {
        processDjUpdate(sonicDj.textContent.trim());
      });
      djObserver.observe(sonicDj, { childList: true, subtree: true, characterData: true });

      function applyBackgroundCover(url) {
        if (!url) return;
        let cleanUrl = url.split('?')[0].trim();
        if (!cleanUrl || cleanUrl === currentCoverUrl) return;

        currentCoverUrl = cleanUrl;
        const tempImg = new Image();
        tempImg.onload = () => {
          playerBgArt.style.backgroundImage = `url('${cleanUrl}')`;
          tempImg.onload = null;
          tempImg.onerror = null;
        };
        tempImg.onerror = () => {
          tempImg.onload = null;
          tempImg.onerror = null;
        };
        tempImg.src = cleanUrl;
      }

      function sanitizeTerm(str) {
        return str
          .replace(/\b(feat|ft|remix|mix|edit|version|radio edit|original mix|extended|official video|audio|lyrics)\b.*$/gi, '')
          .replace(/[\(\[\{].*?[\)\]\}]/g, '')
          .replace(/["'_]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      let fetchCoverTimeout = null;
      function fetchAccurateCover(title, artist) {
        if (fetchCoverTimeout) clearTimeout(fetchCoverTimeout);
        fetchCoverTimeout = setTimeout(async () => {
          const cacheKey = `${artist} - ${title}`.toLowerCase();
          if (coverMemoryCache.has(cacheKey)) {
            applyBackgroundCover(coverMemoryCache.get(cacheKey));
            return;
          }

          const cleanArtist = sanitizeTerm(artist);
          const cleanTitle = sanitizeTerm(title);

          try {
            const query1 = encodeURIComponent(`${cleanArtist} ${cleanTitle}`);
            let res = await fetch(`https://itunes.apple.com/search?term=${query1}&media=music&entity=song&limit=2`);
            let data = await res.json();

            let bestMatch = (data.results && data.results[0]) ? data.results[0] : null;

            if (bestMatch && bestMatch.artworkUrl100) {
              const hires = bestMatch.artworkUrl100.replace('100x100bb', '600x600bb');
              coverMemoryCache.set(cacheKey, hires);
              applyBackgroundCover(hires);
            }
          } catch (_) {}
        }, 1200);
      }

      async function syncMetadataAPI() {
        try {
          const res = await fetch(STATS_URL + "&t=" + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (data.songtitle) {
              updateSongDisplay(data.songtitle);
            }
            if (data.djusername) {
              processDjUpdate(data.djusername);
            }
          }
        } catch (_) {}
      }

      const titleObserver = new MutationObserver(() => {
        const raw = sonicTitle.textContent.trim();
        if (raw) {
          updateSongDisplay(raw);
        }
      });
      titleObserver.observe(sonicTitle, { childList: true, subtree: true, characterData: true });

      setInterval(syncMetadataAPI, 8000);
      syncMetadataAPI();

      // 7. ECUALIZADOR VISUAL
      const canvas = document.getElementById("equalizerCanvas");
      const ctx = canvas ? canvas.getContext("2d", { alpha: true }) : null;

      const NUM_BARS = 28;
      const peaks = new Float32Array(NUM_BARS);
      const precomputedBins = new Uint16Array(NUM_BARS);
      const precomputedBoosts = new Float32Array(NUM_BARS);
      let cachedBarGradient = null;
      let eqLogicalWidth = 0;
      let eqLogicalHeight = 0;

      function buildPrecomputedLookup() {
        const minIndex = 1;
        const binCount = analyser ? analyser.frequencyBinCount : 128;
        const maxIndex = Math.max(2, Math.floor(binCount * 0.65));
        for (let i = 0; i < NUM_BARS; i++) {
          const fraction = i / (NUM_BARS - 1);
          precomputedBins[i] = Math.min(maxIndex, Math.floor(minIndex * Math.pow(maxIndex / minIndex, fraction)));
          precomputedBoosts[i] = 1 + Math.pow(fraction, 1.7) * 0.92;
        }
      }

      function resizeCanvas() {
        if (!canvas || !canvas.parentElement || !ctx) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;

        eqLogicalWidth = rect.width;
        eqLogicalHeight = rect.height;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(eqLogicalWidth * dpr);
        canvas.height = Math.round(eqLogicalHeight * dpr);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        cachedBarGradient = ctx.createLinearGradient(0, eqLogicalHeight, 0, 0);
        cachedBarGradient.addColorStop(0, "#b026ff");
        cachedBarGradient.addColorStop(1, "#00ff66");

        buildPrecomputedLookup();

        if (!isPlaying) {
          renderIdleBars();
        }
      }

      async function setupAudioContext() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.minDecibels = -80;
            analyser.maxDecibels = -10;
            analyser.smoothingTimeConstant = 0.58;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            buildPrecomputedLookup();
          } catch (e) {
            console.warn("Web Audio API:", e);
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
      }

      function renderIdleBars() {
        if (!ctx || eqLogicalWidth <= 0 || eqLogicalHeight <= 0) return;
        ctx.clearRect(0, 0, eqLogicalWidth, eqLogicalHeight);
        const barSpacing = Math.max(2, Math.floor(eqLogicalWidth / 130));
        const barWidth = Math.max(2, Math.floor((eqLogicalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS));
        ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
        for (let i = 0; i < NUM_BARS; i++) {
          ctx.fillRect(i * (barWidth + barSpacing), eqLogicalHeight - 3, barWidth, 3);
          peaks[i] = 0;
        }
      }

      function drawEqualizer() {
        if (!isPlaying || !analyser || !ctx || eqLogicalWidth <= 0) {
          renderIdleBars();
          return;
        }

        eqAnimId = requestAnimationFrame(drawEqualizer);
        ctx.clearRect(0, 0, eqLogicalWidth, eqLogicalHeight);
        analyser.getByteFrequencyData(dataArray);

        const barSpacing = Math.max(2, Math.floor(eqLogicalWidth / 130));
        const barWidth = Math.max(2, Math.floor((eqLogicalWidth - (NUM_BARS - 1) * barSpacing) / NUM_BARS));
        const H = eqLogicalHeight;

        ctx.fillStyle = cachedBarGradient || "#00ff66";
        for (let i = 0; i < NUM_BARS; i++) {
          const val = dataArray[precomputedBins[i]] || 0;
          const norm = Math.min(1, (val / 255) * precomputedBoosts[i]);
          let barHeight = Math.pow(norm, 1.22) * H * 1.3;
          if (barHeight < 3) barHeight = 3;
          else if (barHeight > H) barHeight = H;

          const x = i * (barWidth + barSpacing);
          ctx.fillRect(x, H - barHeight, barWidth, barHeight);

          if (barHeight >= peaks[i]) {
            peaks[i] = barHeight;
          } else {
            peaks[i] = Math.max(0, peaks[i] - 1.9);
          }
        }

        ctx.fillStyle = "#d0d5e2";
        for (let i = 0; i < NUM_BARS; i++) {
          if (peaks[i] > 5) {
            ctx.fillRect(i * (barWidth + barSpacing), H - peaks[i] - 3, barWidth, 2);
          }
        }
      }

      window.addEventListener("resize", resizeCanvas, { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150), { passive: true });
      resizeCanvas();

      async function togglePlay() {
        if (isPlaying) {
          isPlaying = false;
          if (eqAnimId) {
            cancelAnimationFrame(eqAnimId);
            eqAnimId = null;
          }
          audio.pause();
          audio.src = '';
          audio.load();

          playerDeck.classList.remove("is-playing");
          playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
          renderIdleBars();
        } else {
          await setupAudioContext();
          try {
            audio.src = STREAM_URL;
            audio.load();
            await audio.play();

            isPlaying = true;
            playerDeck.classList.add("is-playing");
            playIcon.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="1.5" />`;

            if (!eqAnimId) {
              eqAnimId = requestAnimationFrame(drawEqualizer);
            }
          } catch (e) {
            console.error("Error al iniciar audio:", e);
          }
        }
      }

      btnPlay.addEventListener("click", togglePlay);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (eqAnimId) {
            cancelAnimationFrame(eqAnimId);
            eqAnimId = null;
          }
        } else if (isPlaying && !eqAnimId) {
          eqAnimId = requestAnimationFrame(drawEqualizer);
        }
      });

      // 8. CONTROL DE VOLUMEN
      function updateVolumeVisual(val) {
        audio.volume = val;
        const pct = Math.round(val * 100);
        volumeControl.style.background = `linear-gradient(to right, #b026ff ${pct}%, rgba(255, 255, 255, 0.1) ${pct}%)`;
      }

      volumeControl.addEventListener("input", (e) => {
        updateVolumeVisual(parseFloat(e.target.value));
      });

      volMuteBtn.addEventListener("click", () => {
        volumeControl.value = 0;
        updateVolumeVisual(0);
      });

      volMaxBtn.addEventListener("click", () => {
        volumeControl.value = 1;
        updateVolumeVisual(1);
      });

      updateVolumeVisual(parseFloat(volumeControl.value));

      // 9. MARQUESINA DE TÍTULO
      function recalculateMarquee() {
        displayTitle.classList.remove("marquee-active");
        displayTitle.style.transform = "translateX(0)";

        requestAnimationFrame(() => {
          const containerW = marqueeContainer.clientWidth;
          const textW = displayTitle.scrollWidth;

          if (textW > containerW - 10) {
            const distance = -(textW - containerW + 24);
            const duration = Math.max(6, Math.abs(distance) / 20);
            displayTitle.style.setProperty("--scroll-distance", `${distance}px`);
            displayTitle.style.setProperty("--marquee-duration", `${duration}s`);
            displayTitle.classList.add("marquee-active");
          }
        });
      }

      window.addEventListener("resize", recalculateMarquee, { passive: true });

      function updateSongDisplay(rawString) {
        if (!rawString) return;
        const raw = rawString.trim();
        if (!raw || raw === lastObservedTitle || raw === "Cargando emisión...") return;

        lastObservedTitle = raw;
        let artist = "Nexus Zone Radio";
        let songOnly = raw;

        if (raw.includes(" - ")) {
          const parts = raw.split(" - ");
          artist = parts[0].trim();
          songOnly = parts.slice(1).join(" - ").trim();
        }

        trackArtist.textContent = artist;
        displayTitle.textContent = songOnly;
        recalculateMarquee();
        
        fetchAccurateCover(songOnly, artist);
      }
    });
  </script>
