      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #ffffff;

    }

    .social-btn svg {
      width: clamp(15px, 2vh, 18px);
      height: clamp(15px, 2vh, 18px);
      fill: currentColor;
    }

    .workspace {
      flex: 1;
      width: 100%;
      height: calc(100% - clamp(46px, 5.8vh, 54px));
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 28vw) 1fr;
        gap: clamp(10px, 1.3vw, 18px);
        padding: clamp(6px, 1vh, 12px) clamp(10px, 1.4vw, 20px);
        max-width: 1920px;
        margin: 0 auto;
      }
    }

    @media (min-width: 1440px) {
      .workspace {
        grid-template-columns: 430px 1fr;
        gap: 20px;
        padding: 12px 24px 14px 24px;
      }
    }

    .player-deck {
      background: var(--surface-1);
      padding: clamp(6px, 1vh, 12px) clamp(10px, 2vw, 16px);
      padding-bottom: calc(clamp(6px, 1vh, 10px) + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 900px) {
      .player-deck {
        border: 1px solid var(--border-subtle);
        border-radius: clamp(14px, 2vh, 22px);

    }

    .player-bg-art {
      position: absolute;
      inset: -10px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(10px) brightness(0.68);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform, opacity;
      contain: strict;
    }

    .cover-wrapper {
      width: min(90vw, calc(100dvh - 310px));
      max-width: 90vw;
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: clamp(14px, 2.2vh, 22px);
      margin-top: clamp(8px, 1.8vh, 18px);
      margin-bottom: clamp(8px, 1.8vh, 18px);
      position: relative;
      background: #0d0e15;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      z-index: 2;
      transform: translateZ(0);
      contain: paint;
    }

    @media (min-width: 900px) {
      .cover-wrapper {
        width: min(95%, calc(100dvh - 360px));
        max-width: 95%;
        margin-top: clamp(22px, 3.8vh, 42px);
        margin-bottom: clamp(22px, 3.8vh, 42px);
      }
    }

    .cover-wrapper::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      padding: 2.5px;
      background: conic-gradient(
        from var(--border-angle),
        transparent 0%,
        var(--neon-purple) 20%,
        transparent 38%,
        transparent 50%,
        var(--neon-green) 70%,
        transparent 88%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
      transition: opacity 0.3s ease;
      transform: translateZ(0);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: calc(clamp(14px, 2.2vh, 22px) - 3px);
      object-fit: cover;
      object-position: center;
      background: #08090d;
      position: relative;
      z-index: 2;
      display: block;
    }

    .is-playing .cover-wrapper {
      border-color: transparent;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 16px rgba(176, 38, 255, 0.35);
    }

    .is-playing .cover-wrapper::before {
      opacity: 1;
      animation: neonBorderRotate 4.5s linear infinite;
    }

    @keyframes neonBorderRotate {
      to { --border-angle: 360deg; }
    }

    .deck-mid-section {

    #display_title {
      font-size: clamp(17px, 2.3vh, 23px);
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.2;
      white-space: nowrap;
      display: inline-block;
      padding: 0 10px;
      color: var(--text-primary);
      text-align: center;
      position: relative;
      transform: translateZ(0);
      will-change: transform;
      animation: 
        hackerTitleGlitch 6.8s infinite steps(1),
        hackerVerticalJitter 8.4s infinite ease-in-out,
        hackerSignalDrop 11.2s infinite steps(1),
        hackerPixelShear 9.3s infinite steps(1);
    }

    #display_title::before,
    #display_title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }

    #display_title::before {
      color: #00ff66;
      z-index: -1;
      animation: 
        hackerGlitchSlice1 5.9s infinite linear alternate-reverse,
        hackerScanlineSweep 8.2s infinite ease-in-out,
        hackerGhostTrace 7.5s infinite ease-out;
      opacity: 0.88;
    }

    #display_title::after {
      color: #b026ff;
      z-index: -2;
      animation: hackerGlitchSlice2 6.6s infinite linear alternate-reverse;

    }

    #display_dj {

      position: relative;
      transform: translateZ(0);
      will-change: transform;
      animation: 
        hackerDjGlitch 6.2s infinite steps(1),
        hackerVerticalJitter 7.8s infinite ease-in-out reverse,
        hackerSignalDrop 10.4s infinite steps(1),
        hackerPixelShear 8.7s infinite steps(1);
    }

    #display_dj::before,
    #display_dj::after {
      content: attr(data-text);
      position: absolute;

        hackerGhostTrace 8.1s infinite ease-out;
      opacity: 0.9;
    }

    #display_dj::after {
      color: #00ff66;
      z-index: -2;
      animation: hackerDjSlice2 7.1s infinite linear alternate-reverse;
      opacity: 0.9;
    }

    #djCountryName {
      display: inline-block;
      position: relative;
      transform: translateZ(0);
      will-change: transform;
      animation:

        hackerSignalDrop 11.8s infinite steps(1);
    }

    #djCountryName::before,

      color: #b026ff;

    }

    @keyframes hackerPixelShear {
      0%, 93%, 100% { transform: skewY(0deg) skewX(0deg); filter: none; }
      94% { transform: skewY(-1.2deg) skewX(3deg); filter: drop-shadow(2px 0 0 #b026ff); }
      95% { transform: skewY(1.4deg) skewX(-2deg); filter: drop-shadow(-2px 0 0 #00ff66); }
      96% { transform: skewY(0deg) skewX(0deg); filter: none; }
    }

    @keyframes hackerGhostTrace {
      0%, 91%, 100% { opacity: 0; transform: scale(1); filter: blur(0px); }
      92% { opacity: 0.8; transform: scale(1.03) translate(-2px, -1px); filter: blur(1px); }
      94% { opacity: 0.3; transform: scale(1.05) translate(2px, 1px); filter: blur(2px); }
      96% { opacity: 0; transform: scale(1); filter: blur(0px); }
    }

    @keyframes hackerVerticalJitter {
      0%, 92%, 100% { transform: translateY(0); }
      93% { transform: translateY(-2px); }
      94% { transform: translateY(2px); }
      95% { transform: translateY(-1px); }
      96% { transform: translateY(0); }
    }

    @keyframes hackerScanlineSweep {
      0%, 88%, 100% { clip-path: inset(50% 50% 50% 50%); }
      89% { clip-path: inset(0 0 80% 0); transform: translate(-3px, 0); }
      90% { clip-path: inset(35% 0 50% 0); transform: translate(3px, 0); }
      91% { clip-path: inset(75% 0 0 0); transform: translate(-1.5px, 0); }
      92% { clip-path: inset(50% 50% 50% 50%); }
    }

    @keyframes hackerSignalDrop {
      0%, 95%, 98%, 100% { opacity: 1; filter: none; }
      96% { opacity: 0.35; filter: drop-shadow(2px 0 0 #00ff66) drop-shadow(-2px 0 0 #b026ff); }
      97% { opacity: 0.8; }
    }

    @keyframes hackerTitleGlitch {
      0%, 86%, 100% { transform: translate(0, 0); text-shadow: 0 0 1px rgba(255, 255, 255, 0.2); }
      87% { transform: translate(-3px, 1px) skewX(-2.5deg); text-shadow: 3px 0 #00ff66, -3px 0 #b026ff; }
      88% { transform: translate(2px, -2px) skewX(2.5deg); text-shadow: -3px 0 #00ff66, 3px 0 #b026ff; }
      89% { transform: translate(0, 0); text-shadow: none; }
      95% { transform: translate(2px, 0) scaleY(1.02); text-shadow: -2px 0 #00ff66, 2px 0 #b026ff; }
      96% { transform: translate(0, 0); text-shadow: none; }
    }

    @keyframes hackerGlitchSlice1 {
      0%, 85%, 100% { clip-path: inset(50% 50% 50% 50%); transform: translate(0); }
      86% { clip-path: inset(10% 0 65% 0); transform: translate(-4px, -1px); }
      88% { clip-path: inset(45% 0 25% 0); transform: translate(4px, 1px); }
      90% { clip-path: inset(50% 50% 50% 50%); }
    }

    @keyframes hackerGlitchSlice2 {
      0%, 88%, 100% { clip-path: inset(50% 50% 50% 50%); transform: translate(0); }
      89% { clip-path: inset(25% 0 45% 0); transform: translate(3px, 1px); }
      91% { clip-path: inset(65% 0 10% 0); transform: translate(-3px, -1px); }
      93% { clip-path: inset(50% 50% 50% 50%); }
    }

    @keyframes hackerDjGlitch {
      0%, 87%, 100% { transform: translate(0, 0); text-shadow: 0 0 10px var(--green-glow); }
      88% { transform: translate(2.5px, -1px) skewX(3deg); text-shadow: -3px 0 #b026ff, 3px 0 #00ff66; }
      89% { transform: translate(-2px, 1px) skewX(-2deg); text-shadow: 3px 0 #b026ff, -3px 0 #00ff66; }
      90% { transform: translate(0, 0); text-shadow: 0 0 10px var(--green-glow); }
    }

    @keyframes hackerDjSlice1 {
      0%, 87%, 100% { clip-path: inset(50% 50% 50% 50%); transform: translate(0); }
      88% { clip-path: inset(15% 0 55% 0); transform: translate(3px, -1px); }
      90% { clip-path: inset(50% 50% 50% 50%); }
    }

    @keyframes hackerDjSlice2 {
      0%, 90%, 100% { clip-path: inset(50% 50% 50% 50%); transform: translate(0); }
      91% { clip-path: inset(40% 0 30% 0); transform: translate(-3px, 1px); }
      93% { clip-path: inset(50% 50% 50% 50%); }
    }

    @keyframes hackerCountryGlitch {
      0%, 89%, 100% { transform: translate(0, 0); }
      90% { transform: translate(-2px, 1px) skewX(-2deg); text-shadow: 2px 0 #00ff66, -2px 0 #b026ff; }
      91% { transform: translate(2px, -1px) skewX(2deg); text-shadow: -2px 0 #00ff66, 2px 0 #b026ff; }
      92% { transform: translate(0, 0); text-shadow: none; }
    }

    @keyframes hackerCountrySlice1 {
      0%, 86%, 100% { clip-path: inset(50% 50% 50% 50%); transform: translate(0); }
      87% { clip-path: inset(20% 0 50% 0); transform: translate(2.5px, -1px); }

    @keyframes hackerCountrySlice2 {
      0%, 91%, 100% { clip-path: inset(50% 50% 50% 50%); transform: translate(0); }
      92% { clip-path: inset(55% 0 15% 0); transform: translate(-2.5px, 1px); }
      94% { clip-path: inset(50% 50% 50% 50%); }
    }
