@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  overflow-x: hidden;
}

/* BARRAS DE SCROLL PERSONALIZADAS */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: #09090d;
}
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #bd00ff 0%, #00ff41 100%);
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
}
::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #d844ff 0%, #33ff66 100%);
}

body {
  font-family: 'Orbitron', sans-serif;
  background-color: #0c0c10;
  color: #e0e0e0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* FONDOS AMBIENTALES */
.background-image {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
  background-image: url('img/fondo.png'); background-size: cover;
  background-position: center; background-repeat: no-repeat; pointer-events: none;
  filter: brightness(0.32) contrast(1.05); opacity: 0.52;
  transform: translateZ(0);
}
.background-image::after {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: 
    radial-gradient(circle at 15% 20%, rgba(189, 0, 255, 0.16) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(0, 255, 65, 0.14) 0%, transparent 50%),
    radial-gradient(ellipse at center, rgba(12,12,16,0.5) 0%, rgba(5,5,8,0.92) 100%);
}
.background-grid {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
  background-image: 
    linear-gradient(rgba(189, 0, 255, 0.07) 1px, transparent 1px), 
    linear-gradient(90deg, rgba(0, 255, 65, 0.07) 1px, transparent 1px);
  background-size: 38px 38px; pointer-events: none;
  transform: translateZ(0);
}

/* CABECERA */
header {
  background: linear-gradient(180deg, rgba(28, 28, 36, 0.95) 0%, rgba(14, 14, 18, 0.92) 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 4px 20px rgba(0,0,0,0.7), 0 1px 0 rgba(189,0,255,0.3);
  padding: 0.7rem 1.2rem; text-align: center; position: relative; z-index: 10; flex-shrink: 0;
}
.header-content {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; width: 100%; max-width: 1400px; margin: 0 auto;
}
.header-logo {
  position: absolute; left: 1.5rem; top: 50%; transform: translateY(-50%);
  height: 100%; max-height: 90px; width: auto; max-width: 200px; object-fit: contain; z-index: 11;
  filter: drop-shadow(0 0 10px rgba(189, 0, 255, 0.7)); transition: filter 0.3s ease, transform 0.3s ease;
}
.header-logo:hover {
  filter: drop-shadow(0 0 16px rgba(0, 255, 65, 0.95)) drop-shadow(0 0 5px #fff); 
  transform: translateY(-50%) scale(1.05);
}
.header-text-group {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
}
h1 {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(1.3rem, 3.5vw, 2.5rem);
  letter-spacing: 3px; text-transform: uppercase; 
  background: linear-gradient(90deg, #d844ff 0%, #bd00ff 30%, #00ff41 70%, #66ff8f 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(189, 0, 255, 0.65)); margin: 0; display: inline-block; line-height: 1.1;
}
.header-subtitle {
  font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: clamp(0.7rem, 1.5vw, 1rem);
  letter-spacing: 3px; text-transform: uppercase; 
  background: linear-gradient(to right, #00ff41, #33ff88);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(0, 255, 65, 0.7)); margin: 0; display: inline-block; line-height: 1.1;
}

/* TIRAS LED: CON ACELERACIÓN GPU */
.led-strip-top, .led-strip-bottom {
  height: 8px; background: #26262e; position: relative; z-index: 10;
  transition: background 0.05s ease-out, box-shadow 0.05s ease-out;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9); flex-shrink: 0;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(0, 0, 0, 0.8);
  transform: translateZ(0);
}
.led-strip-top::after, .led-strip-bottom::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(0, 0, 0, 0.6) 6px, rgba(0, 0, 0, 0.6) 8px);
  pointer-events: none; opacity: 0.6;
}

/* CONTENEDOR EN PC */
.main-container {
  display: flex; flex: 1; width: 100%;
  padding: clamp(0.8rem, 2vw, 2rem); gap: clamp(1.2rem, 2.5vw, 3.5rem);
  position: relative; z-index: 1; align-items: center; justify-content: space-between;
}

.player-section, .dj-section {
  flex: 1; width: 100%; background: transparent; border-radius: 10px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}

.section-title {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(1rem, 1.8vw, 1.35rem);
  margin-bottom: 0.8rem; text-align: center; text-transform: uppercase; letter-spacing: 2px;
}

/* TÍTULOS EN MORADO NEÓN */
.player-title, .dj-title {
  color: #bd00ff;
  text-shadow: 0 0 12px rgba(189, 0, 255, 0.75);
  padding-bottom: 0.2rem;
}

/* =========================================================
   CASETE REALISTA (REPRODUCTOR)
   ========================================================= */
.cassette-player {
  width: 100%; max-width: 550px;
  background: 
    radial-gradient(circle at 50% 0%, rgba(189, 0, 255, 0.12) 0%, transparent 60%),
    linear-gradient(168deg, #2d2d35 0%, #1a1a20 40%, #101014 100%);
  border-radius: 16px;
  box-shadow: 
    inset 0 1px 3px rgba(255, 255, 255, 0.25),
    inset 0 -3px 6px rgba(0, 0, 0, 0.9),
    0 16px 36px rgba(0, 0, 0, 0.9),
    0 0 30px rgba(189, 0, 255, 0.3),
    0 0 2px 1px rgba(0, 255, 65, 0.2);
  border: 2px solid #4a4a58;
  padding: clamp(10px, 2vw, 15px) clamp(8px, 1.8vw, 14px) clamp(8px, 1.5vw, 12px) clamp(8px, 1.8vw, 14px);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  user-select: none;
  transform: translateZ(0);
}

.cassette-player::after {
  content: '';
  position: absolute;
  top: 5px; left: 5px; right: 5px; bottom: 5px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-bottom: 1px solid rgba(0, 0, 0, 0.7);
  border-radius: 12px;
  pointer-events: none;
}

.cassette-screw {
  position: absolute; width: clamp(11px, 2.2vw, 14px); height: clamp(11px, 2.2vw, 14px); border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e0e0e8 0%, #767682 45%, #2a2a32 100%);
  border: 1px solid rgba(0, 0, 0, 0.8);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.7), 0 1px 3px rgba(0, 0, 0, 0.85);
  z-index: 15;
}
.cassette-screw::before, .cassette-screw::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  background: #111; border-radius: 0.5px;
  box-shadow: 0 0.5px 0 rgba(255,255,255,0.25);
}
.cassette-screw::before { width: 7px; height: 1.8px; transform: translate(-50%, -50%); }
.cassette-screw::after { width: 1.8px; height: 7px; transform: translate(-50%, -50%); }

.cassette-screw.top-left { top: 8px; left: 8px; }
.cassette-screw.top-right { top: 8px; right: 8px; }
.cassette-screw.top-center { top: 6px; left: 50%; transform: translateX(-50%); }
.cassette-screw.bottom-left { bottom: 8px; left: 8px; }
.cassette-screw.bottom-right { bottom: 8px; right: 8px; }

.album-art-bg {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover; background-position: center; opacity: 0.16; filter: blur(4px); z-index: 1;
}

.cassette-label {
  position: relative; z-index: 2;
  background: 
    linear-gradient(135deg, rgba(189, 0, 255, 0.05) 0%, transparent 40%),
    linear-gradient(180deg, #1c1b24 0%, #111116 100%);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 
    inset 0 0 12px rgba(0,0,0,0.85), 
    0 2px 4px rgba(0,0,0,0.6),
    0 0 0 1px rgba(0, 255, 65, 0.12);
  padding: clamp(6px, 1.5vw, 10px) clamp(8px, 1.8vw, 12px);
  display: flex; flex-direction: column; gap: 6px;
  width: 100%;
}

.label-header-bar {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 2px solid;
  border-image: linear-gradient(90deg, #bd00ff 0%, #00ff41 100%) 1;
  padding-bottom: 4px;
}
.label-side {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(0.85rem, 1.8vw, 0.95rem);
  color: #bd00ff; text-shadow: 0 0 10px rgba(189, 0, 255, 0.7);
  display: flex; align-items: center; gap: 6px;
}
.label-side span {
  background: linear-gradient(135deg, #d844ff 0%, #bd00ff 100%);
  color: #000; font-size: 0.68rem; padding: 2px 6px; border-radius: 3px; font-weight: 900;
  box-shadow: 0 0 6px rgba(189, 0, 255, 0.6);
}
.label-type {
  font-family: 'Share Tech Mono', monospace; font-size: clamp(0.75rem, 1.6vw, 0.85rem); font-weight: 700; color: #00ff41;
  text-shadow: 0 0 8px rgba(0, 255, 65, 0.85);
  border: 1px solid rgba(0, 255, 65, 0.5); padding: 1px 9px; border-radius: 4px;
  background: rgba(0, 255, 65, 0.08);
  letter-spacing: 2.5px;
}

.cassette-write-strip {
  background: 
    repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 19px,
      rgba(189, 0, 255, 0.25) 20px
    ),
    rgba(10, 10, 14, 0.7);
  border: 1px dashed rgba(255, 255, 255, 0.2);
  border-radius: 5px;
  padding: 3px 6px;
  min-height: 36px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.8);
}
.song-info {
  width: 100%; text-align: center; color: #00ff41;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(0.85rem, 2.2vw, 1.2rem);
  letter-spacing: 1.1px; min-height: 26px; display: flex; align-items: center; justify-content: center;
}

.cassette-window-frame {
  background: #060608;
  border-radius: 35px;
  border: 2px solid #3d3d47;
  box-shadow: 
    inset 0 4px 14px rgba(0, 0, 0, 0.98), 
    0 1px 1px rgba(255, 255, 255, 0.15),
    inset 0 0 30px rgba(0, 0, 0, 0.8);
  padding: 5px clamp(6px, 1.8vw, 12px);
  position: relative;
  overflow: hidden;
  margin: 2px 0;
  width: 100%;
}

.cassette-window-frame::before {
  content: ''; position: absolute; top: -60%; left: -35%; width: 70%; height: 220%;
  background: linear-gradient(65deg, transparent 35%, rgba(255,255,255,0.08) 48%, rgba(0,255,65,0.04) 52%, transparent 65%);
  transform: rotate(26deg); pointer-events: none; z-index: 9;
}

.tape-ribbon-track {
  position: absolute; left: 5%; right: 5%; top: 50%; height: clamp(44px, 12vw, 62px);
  transform: translateY(-50%);
  background: linear-gradient(180deg, #1b1008 0%, #3a2012 50%, #150904 100%);
  border-top: 1px solid rgba(0,0,0,0.7);
  border-bottom: 1px solid rgba(0,0,0,0.7);
  border-radius: 18px;
  z-index: 1; opacity: 0.95;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
}

.cassette-tapes {
  display: flex; justify-content: space-between; align-items: center; position: relative;
  z-index: 5; height: clamp(75px, 19vw, 105px); width: 100%; gap: clamp(4px, 1.2vw, 10px);
}

.tape-reel {
  width: clamp(56px, 16.5vw, 84px);
  height: clamp(56px, 16.5vw, 84px);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
  aspect-ratio: 1 / 1;
  backface-visibility: hidden;
}

#tape-left {
  background: radial-gradient(circle at center, #351246 0%, #1d0928 48%, #3a2216 52%, #190e09 100%);
  border: 3px solid #bd00ff;
  box-shadow: 0 0 14px rgba(189, 0, 255, 0.8), inset 0 0 12px rgba(189, 0, 255, 0.55);
}
#tape-left .reel-sprocket {
  border: 2px solid #bd00ff;
  background: radial-gradient(circle at center, #14001c 36%, #bd00ff 40%, #540e74 70%, #20022c 100%);
  box-shadow: 0 0 10px rgba(189, 0, 255, 0.9);
}
#tape-left .reel-sprocket .tooth {
  background: #f7caff; box-shadow: 0 0 5px #bd00ff;
}
#tape-left .tape-clamp-notch { background: #bd00ff; }
#tape-left.animated {
  animation: reelSpin 2.4s linear infinite, purpleReelPulse 1.6s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes purpleReelPulse {
  0% { box-shadow: 0 0 10px rgba(189, 0, 255, 0.7), inset 0 0 8px rgba(189, 0, 255, 0.5); }
  100% { box-shadow: 0 0 22px rgba(189, 0, 255, 1), inset 0 0 15px rgba(189, 0, 255, 0.9); }
}

#tape-right {
  background: radial-gradient(circle at center, #0f3d1d 0%, #082612 48%, #3a2216 52%, #190e09 100%);
  border: 3px solid #00ff41;
  box-shadow: 0 0 14px rgba(0, 255, 65, 0.8), inset 0 0 12px rgba(0, 255, 65, 0.55);
}
#tape-right .reel-sprocket {
  border: 2px solid #00ff41;
  background: radial-gradient(circle at center, #001706 36%, #00ff41 40%, #0f6626 70%, #04270d 100%);
  box-shadow: 0 0 10px rgba(0, 255, 65, 0.9);
}
#tape-right .reel-sprocket .tooth {
  background: #beffce; box-shadow: 0 0 5px #00ff41;
}
#tape-right .tape-clamp-notch { background: #00ff41; }
#tape-right.animated {
  animation: reelSpin 2.4s linear infinite, greenReelPulse 1.6s ease-in-out infinite alternate;
  will-change: transform;
}
@keyframes greenReelPulse {
  0% { box-shadow: 0 0 10px rgba(0, 255, 65, 0.7), inset 0 0 8px rgba(0, 255, 65, 0.5); }
  100% { box-shadow: 0 0 22px rgba(0, 255, 65, 1), inset 0 0 15px rgba(0, 255, 65, 0.9); }
}

.reel-sprocket {
  position: absolute; width: 52%; height: 52%; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.reel-sprocket::after {
  content: ''; width: 44%; height: 44%; border-radius: 50%;
  background: #060608; border: 1.5px solid #282830; z-index: 4;
}
.tape-clamp-notch {
  position: absolute; width: 4px; height: 7px; top: 12%; left: 50%;
  transform: translateX(-50%); border-radius: 1px; z-index: 5;
}

.reel-sprocket .tooth {
  position: absolute; width: 10%; height: 26%;
  border-radius: 1px; z-index: 3;
}
.reel-sprocket .tooth:nth-child(1) { transform: rotate(0deg) translateY(-140%); }
.reel-sprocket .tooth:nth-child(2) { transform: rotate(60deg) translateY(-140%); }
.reel-sprocket .tooth:nth-child(3) { transform: rotate(120deg) translateY(-140%); }
.reel-sprocket .tooth:nth-child(4) { transform: rotate(180deg) translateY(-140%); }
.reel-sprocket .tooth:nth-child(5) { transform: rotate(240deg) translateY(-140%); }
.reel-sprocket .tooth:nth-child(6) { transform: rotate(300deg) translateY(-140%); }
@keyframes reelSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.equalizer-center-box {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 6; height: 100%;
}

.equalizer-container {
  width: 100%; max-width: 200px; min-width: 0;
  height: clamp(34px, 8.5vw, 46px);
  background: rgba(8, 8, 12, 0.94);
  border: 1.5px solid #383846;
  border-radius: 6px;
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: clamp(1.5px, 0.6vw, 3.5px);
  padding: 4px clamp(3px, 1vw, 6px);
  position: relative;
  overflow: hidden;
  box-shadow: 
    inset 0 0 14px rgba(0,0,0,0.98), 
    0 0 10px rgba(0, 255, 65, 0.2),
    0 0 0 1px rgba(189, 0, 255, 0.2);
  transform: translateZ(0);
}

.equalizer-container::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(rgba(0, 0, 0, 0.38) 50%, rgba(0, 255, 65, 0.09) 50%);
  background-size: 100% 4px; pointer-events: none; z-index: 8; opacity: 0.9;
}

.bar {
  width: 100%; height: 3px; border-radius: 1.5px 1.5px 0 0;
  transform-origin: bottom; position: relative; flex: 1;
  background: linear-gradient(to top, #009926, #8500df);
  box-shadow: 0 0 5px rgba(0, 255, 65, 0.65);
}
.bar.bar-mid {
  background: linear-gradient(to top, #00e639, #a819ff);
  box-shadow: 0 0 8px rgba(0, 255, 65, 0.85), 0 0 10px rgba(189, 0, 255, 0.7);
}
.bar.bar-high {
  background: linear-gradient(to top, #00ff41, #d844ff);
  box-shadow: 0 0 12px rgba(0, 255, 65, 1), 0 0 16px rgba(189, 0, 255, 0.95);
}

.cassette-deck-controls {
  position: relative; z-index: 4;
  display: flex; justify-content: center; align-items: center;
  padding: 5px 0 2px 0;
}

.play-btn {
  width: clamp(76px, 20vw, 92px); height: clamp(26px, 6.5vw, 32px);
  background: linear-gradient(180deg, #2b2b33 0%, #15151a 100%);
  border: 2px solid #00ff41; border-radius: 6px; cursor: pointer;
  display: flex; justify-content: center; align-items: center;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(0.9rem, 2.2vw, 1.1rem); color: #00ff41;
  text-shadow: 0 0 8px rgba(0, 255, 65, 0.9);
  box-shadow: 
    0 0 14px rgba(0, 255, 65, 0.45), 
    inset 0 1px 2px rgba(255, 255, 255, 0.25),
    inset 0 -2px 4px rgba(0,0,0,0.8);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.play-btn:hover {
  transform: translateY(-2px); 
  box-shadow: 0 0 22px rgba(0, 255, 65, 0.9), inset 0 1px 2px #fff; 
  border-color: #55ff88; color: #fff;
}
.play-btn.playing {
  border-color: #bd00ff; color: #bd00ff;
  text-shadow: 0 0 10px rgba(189, 0, 255, 0.95);
  box-shadow: 0 0 18px rgba(189, 0, 255, 0.75), inset 0 1px 2px rgba(255, 255, 255, 0.2);
}

.cassette-head-area {
  position: relative;
  width: 78%; margin: 2px auto 0 auto; height: clamp(18px, 4.5vw, 24px);
  background: linear-gradient(180deg, #1d1d24 0%, #101014 100%);
  clip-path: polygon(6% 0%, 94% 0%, 100% 100%, 0% 100%);
  border-bottom: 2px solid #363640;
  display: flex; justify-content: space-around; align-items: center;
  padding: 0 20px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9);
}
.head-hole {

   ========================================================= */
.case-3d-wrapper {
  perspective: 1100px;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.cassette-case {
  width: 100%;
  max-width: 325px;
  aspect-ratio: 1 / 1.42;
  background: 
    linear-gradient(135deg, rgba(255, 255, 255, 0.32) 0%, rgba(55, 55, 68, 0.88) 14%, rgba(14, 14, 18, 0.98) 100%);
  border: 5px solid rgba(255, 255, 255, 0.32);
  border-left: 13px solid rgba(255, 255, 255, 0.5);
  border-right: 7px solid rgba(255, 255, 255, 0.36);
  border-radius: 12px;
  position: relative;
  padding: 8px 9px 8px 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  user-select: none;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  box-shadow: 
    0 22px 46px rgba(0, 0, 0, 0.96),
    -15px 0 32px rgba(189, 0, 255, 0.45),
    15px 0 32px rgba(0, 255, 65, 0.45),
    inset 0 0 0 2px rgba(0, 0, 0, 0.65),
    inset 0 0 0 4px rgba(255, 255, 255, 0.2),
    inset 0 2px 4px rgba(255, 255, 255, 0.55);
  animation: case3DLevitation 6s ease-in-out infinite alternate;
  will-change: transform;
}

@keyframes case3DLevitation {
  0% {
    transform: rotateY(-6deg) rotateX(3deg) translateY(0px);
  }
  50% {
    transform: rotateY(1deg) rotateX(1deg) translateY(-8px);
  }
  100% {
    transform: rotateY(6deg) rotateX(-2deg) translateY(-3px);
  }
}

.cassette-case:hover {
  animation-play-state: paused;
  transform: rotateY(0deg) rotateX(0deg) translateY(-6px) scale(1.02);
  box-shadow: 0 32px 60px rgba(0, 0, 0, 0.98), -22px 0 45px rgba(189, 0, 255, 0.7), 22px 0 45px rgba(0, 255, 65, 0.7);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* GLITCH CYBER */
:root { --pink-neon: #bd00ff; --green-neon: #00ff41; }
.cyber-glitch {
  position: relative; display: inline-block; max-width: 100%; word-break: break-word;
  text-shadow: 0 0 8px rgba(189, 0, 255, 0.9), 0 0 15px rgba(0, 255, 65, 0.7);
  animation: title-glow 2.5s ease-in-out infinite alternate;
}
.cyber-glitch::before, .cyber-glitch::after {
  content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  overflow: hidden; text-align: center; pointer-events: none;
}
.cyber-glitch::before {
  color: var(--pink-neon); clip-path: inset(2px 0 11px 0); animation: glitch-shift-1 2.0s infinite; z-index: -1; opacity: 0.85;
}
.cyber-glitch::after {
  color: var(--green-neon); clip-path: inset(10px 0 3px 0); animation: glitch-shift-2 2.7s infinite; z-index: -2; opacity: 0.85;
}
@keyframes glitch-shift-1 {
  0%, 100% { clip-path: inset(2px 0 11px 0); transform: translate(0, 0); }
  20% { clip-path: inset(1px 0 13px 0); transform: translate(-2px, 2px); }
  50% { clip-path: inset(4px 0 9px 0); transform: translate(2px, -1px); }
}
@keyframes glitch-shift-2 {
  0%, 100% { clip-path: inset(10px 0 3px 0); transform: translate(0, 0); }
  25% { clip-path: inset(6px 0 7px 0); transform: translate(2px, -2px); }
  60% { clip-path: inset(12px 0 1px 0); transform: translate(-2px, 1px); }
}
@keyframes title-glow {
  from { text-shadow: 0 0 8px rgba(189, 0, 255, 0.9), 0 0 15px rgba(0, 255, 65, 0.7); }
  to { text-shadow: 0 0 12px rgba(189, 0, 255, 1), 0 0 25px rgba(0, 255, 65, 0.9); }
}

.cyber-glitch.flash { animation: glitch-flash 0.3s ease; }
.cyber-glitch.pulse { animation: glitch-pulse 0.4s ease; }
.cyber-glitch.chaos { animation: glitch-chaos 0.5s steps(2, start); }
@keyframes glitch-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; transform: scale(1.03); } }
@keyframes glitch-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); text-shadow: 0 0 25px #bd00ff, 0 0 35px #00ff41; } }
@keyframes glitch-chaos { 0%, 100% { transform: translate(0,0); } 30% { transform: translate(-3px, 2px); } 70% { transform: translate(3px, -2px); } }

function getDjCountryInfo(djName) {
  if (!djName || djName.trim() === '') return FALLBACK_COUNTRY;
  const normalize = (str) => str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[|]/g, '').replace(/0/g, 'o').replace(/[^a-z0-9]/g, '_');
  const normalizedInput = normalize(djName);
  for (const [key, value] of Object.entries(djCountryMap)) {
    const normalizedKey = normalize(key);
    if (normalizedInput === normalizedKey || normalizedInput.includes(normalizedKey) || normalizedKey.includes(normalizedInput)) { return value; }
  }
  return FALLBACK_COUNTRY;
}

function updateDjCountryDisplay(djName = '') {
  const now = Date.now();
  if (now - lastCountryUpdate < COUNTRY_UPDATE_DEBOUNCE) return;
  lastCountryUpdate = now;
  const countryInfo = document.getElementById('dj-country-info');
  const djFlagImg = document.getElementById('dj-flag-img');
  const djCountryName = document.getElementById('dj-country-name');
  if (!countryInfo || !djFlagImg || !djCountryName) return;
  const info = getDjCountryInfo(djName);
  if (djCountryName.textContent === info.country && djFlagImg.src === info.flagUrl) return;
  djFlagImg.style.opacity = '0';
  djCountryName.style.opacity = '0';
  setTimeout(() => {
    djFlagImg.src = info.flagUrl;
    djFlagImg.alt = info.country;
    djCountryName.textContent = info.country;
    djFlagImg.style.opacity = '1';
    djCountryName.style.opacity = '1';
  }, 200);
}

function isAutoDJ(djName) {
  if (!djName) return true;
  const normalized = djName.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const listaBloqueo = ['', 'no dj', 'autodj', 'nexus dj', 'nexusdj', 'smiledj', 'cisnenegro', 'pueblo_rock', 'w0lf', 'djivan', 'lu50n', '|lu5|on', 'AndreSZ'];
  return listaBloqueo.includes(normalized);
}

function updateRequestsButtonState(djName = '') {
  const requestsBtn = document.getElementById('requests-btn');

function handleVolumeInput(val) {

  updateVolumeDisplay();
}

let isDraggingVolume = false;
function setVolumeFromPointer(e) {
  const rect = volumeSlider.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const ratio = (clientX - rect.left) / rect.width;
  handleVolumeInput(ratio);
}

volumeSlider.addEventListener('pointerdown', (e) => {
  isDraggingVolume = true;
  setVolumeFromPointer(e);
  volumeSlider.setPointerCapture(e.pointerId);
});
volumeSlider.addEventListener('pointermove', (e) => {
  if (isDraggingVolume) setVolumeFromPointer(e);
});
volumeSlider.addEventListener('pointerup', (e) => {
  if (isDraggingVolume) {
    isDraggingVolume = false;
    try { volumeSlider.releasePointerCapture(e.pointerId); } catch(err){}
  }
});
volumeSlider.addEventListener('pointercancel', () => { isDraggingVolume = false; });

function updateGlitchDataText(el) {
  if (el && el.classList.contains('cyber-glitch')) {
    el.setAttribute('data-text', el.textContent.trim());
  }
}

function triggerRandomGlitch(el) {
  if (!el || !el.classList.contains('cyber-glitch')) return;
  const effects = ['flash', 'pulse', 'chaos'];
  const randomEffect = effects[Math.floor(Math.random() * effects.length)];
  el.classList.remove('flash', 'pulse', 'chaos');
  void el.offsetWidth;
  el.classList.add(randomEffect);
  setTimeout(() => el.classList.remove(randomEffect), 800);
}

function updateDjImage(djName = 'autodj') {
  if (!djProfileImg) return;
  const normalized = djName.toLowerCase().replace(/\s/g, '');
  let imageName = normalized.includes('|lu5|0n') || normalized.includes('lu50n') ? 'ilusion' : sanitizeDjName(djName);
  const targetSrc = `portadasdjs/${imageName}.png`;
  if (!djProfileImg.src.endsWith(targetSrc)) {
    djProfileImg.src = targetSrc;
    djProfileImg.alt = djName;
    djProfileImg.onerror = function() {
      if (imageName.toLowerCase() !== 'autodj') {
        this.onerror = null; this.src = 'portadasdjs/autodj.png'; this.alt = 'Auto DJ';
      }
    };
  }
}

function checkAndUpdateDjImage() {
  if (!sonicDj || !djProfileImg) return;
  const currentText = sonicDj.textContent.trim();
  if (currentText.toUpperCase().includes('NO DJ') || currentText === '') {
    sonicDj.textContent = 'NeXus DJ'; updateGlitchDataText(sonicDj); updateDjImage('autodj'); return true;
  } else if (currentText && currentText.toUpperCase() !== 'NEXUS DJ') { updateDjImage(currentText); }
  return false;
}

function toggleChat() {
  isChatVisible = !isChatVisible;
  if(isChatVisible) {
    if (chatDestroyTimer) { clearTimeout(chatDestroyTimer); chatDestroyTimer = null; }
    if (!document.getElementById('chat-iframe')) {
      const num = Math.floor(Math.random() * 1000);
      chatIframeContainer.innerHTML = `<iframe id="chat-iframe" class="${isChatDarkMode ? 'dark-mode' : ''}" src="https://chat.chatzona.org/index.html#nick=nexus_user${num}&channel=Nexus_Zone" width="100%" height="100%" frameborder="0" loading="lazy" allow="microphone"></iframe>`;
    }
    chatPanel.classList.add('visible');
    chatOverlay.classList.add('active'); 
    setTimeout(adjustChatIframeForMobile, 300);
    document.body.style.overflow = '';
    if (isVisualizing) { isVisualizing = false; if (animationId) cancelAnimationFrame(animationId); }
  } else {
    chatDestroyTimer = setTimeout(() => { destroyChatIframe(); chatDestroyTimer = null; }, CHAT_DESTROY_DELAY);
    chatPanel.classList.remove('visible');
    chatOverlay.classList.remove('active'); 
    chatPanel.style.height = '';
    document.body.style.overflow = '';
    if (isPlaying && analyzer && !isVisualizing) { isVisualizing = true; visualize(); }
  }
}

let isSyncing = false;
const BIN_ID = '6a1c1975ddf5aa59f77b6dc2';
const API_KEY = '$2a$10$l7pwDNDS96podLHrossjbOom0nbtKWJsj/x7GiKPzXq0M4SMWTgQq';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

function sanitizeHtml(str) { return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function getCooldowns() { try { return JSON.parse(localStorage.getItem('nz_cooldowns') || '{}'); } catch { return {}; } }
function saveCooldowns(data) { localStorage.setItem('nz_cooldowns', JSON.stringify(data)); }
async function loadRequests() {
  try {
    const res = await fetch(`${BIN_URL}/latest`, { headers: { 'X-Master-Key': API_KEY } });
    if (!res.ok) throw new Error('Error al cargar');
    const data = await res.json();
    return Array.isArray(data.record) ? data.record : (data.record && Array.isArray(data.record.requests) ? data.record.requests : []);
  } catch(e) { return []; }
}
async function saveRequests(reqs) {
  if (isSyncing) return; isSyncing = true;
  try { await fetch(BIN_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY }, body: JSON.stringify({ requests: reqs }) }); }
  catch(e) { alert("Error guardando petición. Revisa tu conexión."); }
  finally { isSyncing = false; }
}
async function renderRequests() {
  if (isSyncing) return;
  requestList.innerHTML = '<p style="color:#888;text-align:center;">⏳ Cargando peticiones...</p>';
  let reqs = await loadRequests();
  const now = Date.now();
  const active = reqs.filter(r => now - r.time < REQUEST_EXPIRY);
  if (active.length !== reqs.length) await saveRequests(active);
  reqs = active; reqs.sort((a,b) => b.time - a.time);
  requestList.innerHTML = reqs.length === 0 ? '<p style="color:#888;text-align:center;margin-top:10px;">Sin peticiones activas</p>' : '';
  const fragment = document.createDocumentFragment();
  reqs.forEach((r, i) => {
    const timeLeft = Math.max(0, Math.ceil((REQUEST_EXPIRY - (now - r.time)) / 60000));
    const div = document.createElement('div'); div.className = 'request-item';
    div.innerHTML = `<div><span class="request-text">${sanitizeHtml(r.nick)} - ${sanitizeHtml(r.text)}</span><span class="request-time">⏱️ ${timeLeft}min</span></div>${userRole === 'dj' ? `<button class="request-delete-btn" data-idx="${i}">×</button>` : ''}`;
    fragment.appendChild(div);
  });
  requestList.appendChild(fragment);
}
async function handleRequestSubmit() {
  if (isSyncing) return alert("⏳ Guardando petición anterior, espera un momento.");
  const nick = requestNickInput.value.trim(); const text = requestInput.value.trim();
  if (!nick) return alert('Por favor, escribe tu Nick.');
  if (!text) return alert('Por favor, escribe la Canción - Artista.');
  if (text.length > 80) return alert('Máximo 80 caracteres.');
  const cooldowns = getCooldowns();
  const lastTime = cooldowns[nick.toLowerCase()] || 0;
  if (Date.now() - lastTime < REQUEST_COOLDOWN) {
    const waitSec = Math.ceil((REQUEST_COOLDOWN - (Date.now() - lastTime)) / 1000);
    return alert(`⏳ Debes esperar ${waitSec} segundos antes de pedir otra canción.`);
  }
  const reqs = await loadRequests();
  reqs.push({ nick, text, time: Date.now(), id: Math.random().toString(36).substr(2, 9) });
  await saveRequests(reqs);
  cooldowns[nick.toLowerCase()] = Date.now(); saveCooldowns(cooldowns);
  requestInput.value = ''; await renderRequests(); requestInput.focus();
}
async function deleteRequest(idx) {
  if (userRole !== 'dj' || isSyncing) return;
  const reqs = await loadRequests(); reqs.splice(idx, 1); await saveRequests(reqs); await renderRequests();
}
function toggleRequestsPanel() {
  const isVisible = requestsPanel.classList.contains('visible');
  if (!isVisible) {
    requestsPanel.classList.add('visible'); requestsOverlay.classList.add('active'); document.body.style.overflow = '';
    if (!userRole) { requestPassInput.focus(); } else { renderRequests().then(() => startRefresh()); }
  } else {
    requestsPanel.classList.remove('visible'); requestsOverlay.classList.remove('active'); document.body.style.overflow = ''; stopRefresh();
  }
}
function startRefresh() {
  if (!requestRefreshInterval && requestsPanel.classList.contains('visible')) {
    requestRefreshInterval = setInterval(() => { 
      if (requestsPanel.classList.contains('visible') && !document.hidden) renderRequests(); 
      else if (!requestsPanel.classList.contains('visible')) stopRefresh(); 
    }, 45000);
  }
}
function stopRefresh() { if (requestRefreshInterval) { clearInterval(requestRefreshInterval); requestRefreshInterval = null; } }
function initRequestsListeners() {
  requestsBtn.addEventListener('click', (e) => { e.preventDefault(); toggleRequestsPanel(); });
  requestsClose.addEventListener('click', toggleRequestsPanel);
  requestsOverlay.addEventListener('click', toggleRequestsPanel);
  document.addEventListener('keydown', (e) => { if(e.key==='Escape' && requestsPanel.classList.contains('visible')) toggleRequestsPanel(); });
  requestAuthBtn.addEventListener('click', () => {
    const pass = requestPassInput.value;
    if (pass === DJ_PASS) { userRole = 'dj'; enterPanel(); }
    else if (pass === LISTENER_PASS) { userRole = 'listener'; enterPanel(); }
    else { alert('Contraseña incorrecta'); }
  });
  requestPassInput.addEventListener('keydown', (e) => { if(e.key==='Enter') requestAuthBtn.click(); });
  requestSubmitBtn.addEventListener('click', handleRequestSubmit);
  requestInput.addEventListener('keydown', (e) => { if(e.key==='Enter') handleRequestSubmit(); });
  requestList.addEventListener('click', (e) => { const btn = e.target.closest('.request-delete-btn'); if (btn) deleteRequest(parseInt(btn.dataset.idx)); });
  requestLogoutBtn.addEventListener('click', () => { userRole = null; requestsMain.style.display = 'none'; requestsAuth.style.display = 'flex'; requestPassInput.value = ''; stopRefresh(); });
}
function enterPanel() { requestsAuth.style.display = 'none'; requestsMain.style.display = 'flex'; renderRequests().then(() => startRefresh()); }

function setupAudioGraph() {
  if(audioGraphSetup || !audioContext) return;
  try {
    analyzer = audioContext.createAnalyser(); analyzer.fftSize = 512; analyzer.smoothingTimeConstant = 0.82;
    dataArray = new Uint8Array(analyzer.frequencyBinCount);
    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyzer); analyzer.connect(audioContext.destination); audioGraphSetup = true;
  } catch(e) { console.error("✗ Error audio graph:", e); }
}
function startVisualizer() { if(isVisualizing || !analyzer) return; isVisualizing = true; visualize(); }
function stopVisualizer() {
  isVisualizing = false; if(animationId) cancelAnimationFrame(animationId); animationId = null;
  for(let i=0; i<barCount; i++) { 
    bars[i].style.height='3px'; 
    bars[i].className = 'bar';
  }
  ledTop.style.background='#8b8b8b'; ledTop.style.boxShadow='0 0 0 rgba(139,139,139,0)';
  ledBottom.style.background='#8b8b8b'; ledBottom.style.boxShadow='0 0 0 rgba(139,139,139,0)';
  ledIsLit = false;
  beatIntensity = 0;
  bar0History.fill(0);
}

const freqSpectrumBands = [
  { start: 1, end: 3, mult: 0.82 },
  { start: 3, end: 6, mult: 0.84 },
  { start: 6, end: 10, mult: 0.88 },
  { start: 10, end: 16, mult: 0.94 },
  { start: 16, end: 24, mult: 1.02 },
  { start: 24, end: 36, mult: 1.12 },
  { start: 36, end: 52, mult: 1.25 },
  { start: 52, end: 72, mult: 1.42 },
  { start: 72, end: 98, mult: 1.65 },
  { start: 98, end: 130, mult: 1.95 },
  { start: 130, end: 165, mult: 2.35 },
  { start: 165, end: 200, mult: 2.85 }
];

function updateLedsDirectKick() {
  if (!isPlaying || !analyzer || !dataArray) {
    if (ledIsLit) {
      ledIsLit = false;
      beatIntensity = 0;
      ledTop.style.background = '#8b8b8b';
      ledTop.style.boxShadow = '0 0 0 rgba(0,0,0,0)';
      ledBottom.style.background = '#8b8b8b';
      ledBottom.style.boxShadow = '0 0 0 rgba(0,0,0,0)';
    }
    return;
  }

  const rawSub = (dataArray[1] * 1.6 + dataArray[2] * 0.7) / 2.3;
  const kickEnergy = Math.pow(Math.min(1, (rawSub / 235) * 0.9), 1.3);

  bar0History[historyIdx] = kickEnergy;
  historyIdx = (historyIdx + 1) % historySize;

  let minBaseline = 1.0;
  for (let k = 0; k < historySize; k++) {
    if (bar0History[k] < minBaseline) minBaseline = bar0History[k];
  }

  const kickJump = kickEnergy - minBaseline;
  const now = Date.now();

  const isKickHit = (
    kickJump > 0.06 || 
    (kickEnergy > 0.28 && kickJump > 0.035) || 
    (kickEnergy > 0.62 && kickJump > 0.020)
  ) && (now - lastKickTime > 215);

  if (isKickHit) {
    lastKickTime = now;
    ledColorIndex = (ledColorIndex + 1) % ledColors.length;
    beatIntensity = Math.min(1.0, Math.max(0.65, kickJump * 2.5 + kickEnergy * 0.35));
  } else {
    beatIntensity *= 0.86;
  }

  if (beatIntensity > 0.05) {
    const currentColor = ledColors[ledColorIndex];
    const glow1 = Math.round(10 + beatIntensity * 16);
    const glow2 = Math.round(18 + beatIntensity * 26);
    const alpha = (0.35 + beatIntensity * 0.65).toFixed(2);

    if (currentColor === '#ffffff') {
      ledTop.style.background = `rgba(250, 250, 250, ${alpha})`;
      ledTop.style.boxShadow = `0 0 ${glow1}px #ffffff, 0 0 ${glow2}px rgba(255, 255, 255, ${alpha}), inset 0 0 6px rgba(255, 255, 255, 0.9)`;
    } else {
      ledTop.style.background = currentColor;
      ledTop.style.boxShadow = `0 0 ${glow1}px ${currentColor}, 0 0 ${glow2}px ${currentColor}, inset 0 0 6px rgba(255, 255, 255, 0.65)`;
    }
    ledBottom.style.background = ledTop.style.background;
    ledBottom.style.boxShadow = ledTop.style.boxShadow;
    ledIsLit = true;
  } else if (ledIsLit) {
    ledIsLit = false;
    ledTop.style.background = '#8b8b8b';
    ledTop.style.boxShadow = '0 0 0 rgba(0,0,0,0)';
    ledBottom.style.background = '#8b8b8b';
    ledBottom.style.boxShadow = '0 0 0 rgba(0,0,0,0)';
  }
}

/* VISUALIZADOR OPTIMIZADO: SIN LAYOUT REFLOWS EN EL BUCLE */
function visualize() {
  if(!isVisualizing || !analyzer || !isPlaying) { stopVisualizer(); return; }
  const frameSkip = isMobileDevice ? 2 : 1;
  visualizerFrameCount++;
  if(visualizerFrameCount % frameSkip !== 0) { animationId = requestAnimationFrame(visualize); return; }
  
  analyzer.getByteFrequencyData(dataArray); 
  const totalBins = dataArray.length;
  const maxHeight = cachedContainerHeight - 5;
  const minHeight = 3;
  
  for(let i=0; i<barCount; i++) {
    const band = freqSpectrumBands[i];
    let sum = 0, count = 0;
    const start = Math.min(band.start, totalBins - 1);
    const end = Math.min(band.end, totalBins);
    
    for(let j=start; j<end; j++) { 
      sum += dataArray[j]; 
      count++; 
    }
    const avg = count > 0 ? sum / count : 0;
    
    let norm = (avg / 255) * band.mult;
    if (norm > 1) norm = 1;
    let dynamicNorm = Math.pow(norm, 1.35);
    let height = Math.round(minHeight + dynamicNorm * (maxHeight - minHeight));

    bars[i].style.height = height + 'px';
    
    const targetClass = height >= maxHeight * 0.78 ? 'bar bar-high' : (height >= maxHeight * 0.42 ? 'bar bar-mid' : 'bar');
    if (bars[i].className !== targetClass) {
      bars[i].className = targetClass;
    }
  }
  
  updateLedsDirectKick();
  animationId = requestAnimationFrame(visualize);
}

function togglePlayPause() {
  if(!isPlaying) {
    if(audio.src !== streamUrl) audio.src = streamUrl;
    if(!audioContext) { 
      window.AudioContext = window.AudioContext || window.webkitAudioContext; 
      if(window.AudioContext) audioContext = new AudioContext(); 
      else { alert("Navegador no soporta Web Audio API."); return; } 
    }
    if(audioContext.state==='suspended') audioContext.resume();
    if(!audioGraphSetup) setupAudioGraph();
    audio.play().then(() => {
      isPlaying = true; playPauseBtn.innerHTML = '■'; playPauseBtn.classList.add('playing');
      tapeLeft.classList.add('animated'); tapeRight.classList.add('animated');
      if(analyzer) startVisualizer();
    }).catch(err => {
      console.error("✗ Error play:", err);
      alert(err.name==='NotAllowedError' ? 'Haz clic de nuevo para permitir audio.' : 'Error de conexión o reproducción.');
    });
  } else {
    audio.pause(); 
    audio.removeAttribute('src'); 
    audio.load();
    isPlaying = false;
    playPauseBtn.innerHTML = '▶'; playPauseBtn.classList.remove('playing');
    tapeLeft.classList.remove('animated'); tapeRight.classList.remove('animated');
    stopVisualizer();
  }
}
playPauseBtn.addEventListener('click', togglePlayPause);

function setupGlitchObservers() {
  if(sonicTitle) {
    const obs = new MutationObserver(() => { 
      updateGlitchDataText(sonicTitle); 
      if(Math.random()<0.35) triggerRandomGlitch(sonicTitle); 
    });
    obs.observe(sonicTitle, {childList:true, characterData:true}); 
    updateGlitchDataText(sonicTitle);
  }
  if(sonicDj) {
    const obs = new MutationObserver(() => {
      if(countryUpdateLock) return; countryUpdateLock = true;
      updateGlitchDataText(sonicDj); checkAndUpdateDjImage();
      const txt = sonicDj.textContent.trim();
      updateDjCountryDisplay(txt); updateRequestsButtonState(txt);
      if(Math.random()<0.35) triggerRandomGlitch(sonicDj);
      setTimeout(()=>countryUpdateLock=false, 150);
    });
    obs.observe(sonicDj, {childList:true, characterData:true});
    updateGlitchDataText(sonicDj); checkAndUpdateDjImage(); updateDjCountryDisplay(sonicDj.textContent.trim()); updateRequestsButtonState(sonicDj.textContent.trim());
  }
}

let lastArtUrl = '';
function updateAlbumArtBackground() { 
  const c = document.getElementById('sonic_art_full'); 
  if(c && c.querySelector('img')) { 
    const s = c.querySelector('img').src; 
    if(s && s !== lastArtUrl) { 
      lastArtUrl = s;
      albumArtBg.style.backgroundImage = `url('${s}')`; 
      albumArtBg.style.opacity = '0.2'; 
    } 
  } 
}

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    if (isVisualizing) {
      isVisualizing = false;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }
  } else {
    if (isPlaying && analyzer && !isVisualizing) {
      isVisualizing = true;
      visualize();
    }
  }
});

window.addEventListener('load', function() {
  updateCachedLayout();
  updateAlbumArtBackground(); setupGlitchObservers(); initChatListeners(); initStaffListeners(); initAdListeners();
  initRequestsListeners(); initPoemListeners(); adjustChatIframeForMobile();
  updateDjCountryDisplay(sonicDj ? sonicDj.textContent.trim() : '');
  setTimeout(() => { if (sonicDj) updateRequestsButtonState(sonicDj.textContent.trim()); }, 1000);
  
  const artContainer = document.getElementById('sonic_art_full');
  if (artContainer) {
    let artDebounce = null;
    const artObserver = new MutationObserver(() => { 
      if (artDebounce) clearTimeout(artDebounce);
      artDebounce = setTimeout(() => updateAlbumArtBackground(), 400); 
    });
    artObserver.observe(artContainer, { childList: true, subtree: true });
  }
  console.log("🎧 Nexus Zone cargado con éxito y optimizado.");
});

audio.addEventListener('ended', () => { if(isPlaying) togglePlayPause(); });
audio.addEventListener('error', (e) => { console.error("✗ Audio error:", e); if(isPlaying) togglePlayPause(); });
document.body.addEventListener('touchstart', function initMobile(){ 
  if(!audioContext && window.AudioContext){ 
    audioContext = new AudioContext(); 
    audioContext.suspend(); 
  } 
  document.body.removeEventListener('touchstart', initMobile); 
}, {once:true, passive: true});
</script>
