<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nexus Zone - Radio Web</title>
    <style>
        /* Estilos generales oscuros / cyberpunk acordes a tu proyecto */
        body { background: #0b0b0e; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .tab-content { display: none; background: #15151a; padding: 20px; border-radius: 8px; border: 1px solid #2a2a35; margin-top: 15px; }
        .tab-content.active { display: block; }
        .nav-tabs button { background: #22222d; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-right: 5px; }
        .nav-tabs button.active { background: #00ffcc; color: #0b0b0e; }
        input, textarea { background: #0b0b0e; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button.btn-accion { background: #00ffcc; color: #0b0b0e; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button.btn-borrar { background: #ff3366; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>

    <h1>Nexus Zone Web Radio</h1>

    <!-- Menú de pestañas (Ejemplo con Poemas y Peticiones) -->
    <div class="nav-tabs">
        <button onclick="cambiarPestaña('poemas', event)">Poemas</button>
        <button class="active" onclick="cambiarPestaña('peticiones', event)">Peticiones</button>
    </div>

    <!-- PESTAÑA DE POEMAS (Tu contenido existente) -->
    <div id="tab-poemas" class="tab-content">
        <h2>📜 Sección de Poemas</h2>
        <p>Aquí van tus poemas guardados...</p>
    </div>

    <!-- PESTAÑA DE PETICIONES (Nueva integración) -->
    <div id="tab-peticiones" class="tab-content active">
        <h2>🎵 Peticiones Musicales</h2>
        
        <!-- Formulario del oyente -->
        <form id="formPet">
            <label>Tu Apodo:</label>
            <input type="text" id="oyente" placeholder="Ej: Castle" required>
            
            <label>Artista y Canción:</label>
            <input type="text" id="cancion" placeholder="Ej: Daft Punk - One More Time" required>
            
            <button type="submit" class="btn-accion">Enviar Petición</button>
        </form>
        <p id="cooldownAviso" style="color: #ff9900; font-size: 13px; margin-top: 5px;"></p>

        <hr style="border-color: #2a2a35; margin: 20px 0;">

        <!-- Lista pública -->
        <h3>📋 Lista en Directo</h3>
        <ul id="listaPeticionesPub">Cargando peticiones...</ul>

        <hr style="border-color: #2a2a35; margin: 20px 0;">

        <!-- Panel de DJ / Admin Oculto por contraseña -->
        <div id="djContainer">
            <div id="djLoginBox">
                <h3>🎧 Zona de DJs</h3>
                <input type="password" id="passDJ" placeholder="Contraseña de DJ">
                <button onclick="verificarDJ()" class="btn-accion" style="margin-top: 5px;">Entrar como DJ</button>
            </div>

            <div id="djPanelBox" style="display:none;">
                <h3 style="color: #00ffcc;">Panel de Control (DJ)</h3>
                <p style="font-size: 12px; color: #888;">Borra las canciones conforme vayan sonando al aire.</p>
                <ul id="listaPeticionesDJ"></ul>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const API_URL = "TU_URL_DE_NPOINT_AQUI"; // Pega aquí tu enlace de npoint.io
        const PASSWORD_SECRETA = "tu_clave_dj_123"; // Contraseña para desbloquear el panel DJ

        // --- SISTEMA DE PESTAÑAS ---
        function cambiarPestaña(nombreTab, evento) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + nombreTab).classList.add('active');
            evento.currentTarget.classList.add('active');
        }

        // --- 1. ENVIAR PETICIÓN CON COOLDOWN DE 5 MINUTOS ---
        document.getElementById('formPet').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validar Cooldown (5 minutos = 300,000 ms)
            const ultimoEnvio = localStorage.getItem('ultima_peticion');
            const ahora = Date.now();
            if (ultimoEnvio && (ahora - ultimoEnvio < 300000)) {
                const minutosRestantes = Math.ceil((300000 - (ahora - ultimoEnvio)) / 60000);
                alert(`Debes esperar ${minutosRestantes} minuto(s) más antes de enviar otra petición.`);
                return;
            }

            const nuevaPeticion = {
                id: Date.now(),
                oyente: document.getElementById('oyente').value,
                cancion: document.getElementById('cancion').value
            };

            try {
                // Obtener datos actuales de npoint
                const res = await fetch(API_URL);
                const data = await res.json();
                if (!data.peticiones) data.peticiones = [];

                // Añadir al principio de la lista
                data.peticiones.unshift(nuevaPeticion);

                // Guardar de vuelta en npoint
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // Registrar tiempo actual en el navegador del usuario
                localStorage.setItem('ultima_peticion', Date.now());

                alert('¡Petición enviada con éxito!');
                document.getElementById('cancion').value = '';
                cargarListas();
            } catch (err) {
                alert('Error al conectar con el servidor de peticiones.');
            }
        });

        // --- 2. CARGAR Y ACTUALIZAR LISTAS (PÚBLICA Y DJ) ---
        async function cargarListas() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const peticiones = data.peticiones || [];

                // Renderizar lista pública
                const ulPub = document.getElementById('listaPeticionesPub');
                ulPub.innerHTML = '';
                if (peticiones.length === 0) {
                    ulPub.innerHTML = '<li>No hay peticiones pendientes. ¡Sé el primero en pedir una!</li>';
                } else {
                    peticiones.forEach(p => {
                        const li = document.createElement('li');
                        li.innerHTML = `<b>${escapeHtml(p.oyente)}:</b> ${escapeHtml(p.cancion)}`;
                        ulPub.appendChild(li);
                    });
                }

                // Renderizar lista de DJ (si ha iniciado sesión)
                const ulDJ = document.getElementById('listaPeticionesDJ');
                if (ulDJ && document.getElementById('djPanelBox').style.display !== 'none') {
                    ulDJ.innerHTML = '';
                    if (peticiones.length === 0) {
                        ulDJ.innerHTML = '<li>Lista vacía.</li>';
                    } else {
                        peticiones.forEach(p => {
                            const li = document.createElement('li');
                            li.innerHTML = `<b>${escapeHtml(p.oyente)}:</b> ${escapeHtml(p.cancion)} <button class="btn-borrar" onclick="borrarPeticion(${p.id})">Borrar</button>`;
                            ulDJ.appendChild(li);
                        });
                    }
                }
            } catch (e) {
                console.error("Error al actualizar las listas");
            }
        }

        // --- 3. LOGIN Y BORRADO DE DJ ---
        function verificarDJ() {
            const pass = document.getElementById('passDJ').value;
            if (pass === PASSWORD_SECRETA) {
                document.getElementById('djLoginBox').style.display = 'none';
                document.getElementById('djPanelBox').style.display = 'block';
                cargarListas();
            } else {
                alert('Contraseña incorrecta');
            }
        }

        async function borrarPeticion(id) {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data.peticiones) {
                    data.peticiones = data.peticiones.filter(p => p.id !== id);
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    cargarListas();
                }
            } catch (e) {
                alert('No se pudo borrar la petición.');
            }
        }

        // Función auxiliar para seguridad básica de texto (evitar inyección HTML)
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Actualizar automáticamente cada 5 segundos en tiempo real
        setInterval(cargarListas, 5000);
        cargarListas();
    </script>
</body>
</html>
